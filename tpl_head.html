<style>
:root{
  --paper:#FFFFFF; --raise:#FAFAFB; --field:#F5F6F8;
  --ink:#0B0C0E; --ink-soft:#33363B; --grey-6:#6C7178; --grey-4:#70757C;
  --rule:#DCDFE3; --rule-soft:#EBEDF0; --bar:#C9CDD3;
  --invert-bg:#0B0C0E; --invert-fg:#FFFFFF; --focus:#0B0C0E;
  --fs-xs:.62rem;   --fs-sm:.68rem;  --fs-base:.8rem; --fs-md:.88rem;
  --fs-lg:1rem;     --fs-xl:1.5rem;  --fs-2xl:2.6rem;
  /* greys are pinned to WCAG AA: --grey-4 carries row years, dates and small labels,
     and at the old #A0A5AC it hit 2.48:1 on white. These clear 4.6:1 in both themes. */
  --ls-label:.13em; --ls-data:.05em;
  --sp-1:6px; --sp-2:11px; --sp-3:18px; --sp-4:30px;
  --serif-text:"Newsreader","Iowan Old Style","Palatino",Georgia,serif;  /* every serif on the page */
  --sans:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0B0C0E; --raise:#111316; --field:#15171A;
    --ink:#F1F2F4; --ink-soft:#C7CACE; --grey-6:#8B9098; --grey-4:#7A7F86;
    --rule:#2B2E34; --rule-soft:#212429; --bar:#3F434A;
    --invert-bg:#F1F2F4; --invert-fg:#0B0C0E; --focus:#F1F2F4;
  }
}
:root[data-theme="dark"]{
  --paper:#0B0C0E; --raise:#111316; --field:#15171A;
  --ink:#F1F2F4; --ink-soft:#C7CACE; --grey-6:#8B9098; --grey-4:#7A7F86;
  --rule:#2B2E34; --rule-soft:#212429; --bar:#3F434A;
  --invert-bg:#F1F2F4; --invert-fg:#0B0C0E; --focus:#F1F2F4;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;font-optical-sizing:auto;text-rendering:optimizeLegibility}
/* digits that sit in columns must not jitter */
.r-year,.mast-stats b,.g-num,.mono-fig,.ai-n,.gy-y,.gy-n,.yr-n,.bar-n,.chip span,.mem-num,.g-count,.count-line
  {font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}

.masthead{padding:34px 0 20px;border-bottom:1px solid var(--ink)}
.mast-grid{display:grid;grid-template-columns:1fr auto;gap:32px;align-items:end}
h1{font-family:var(--serif-text);font-weight:500;font-size:clamp(2.1rem,4.6vw,3.2rem);line-height:1;letter-spacing:-.015em;margin:0;text-wrap:balance}
h1 em{font-style:italic;font-weight:400}
/* the wordmark is the way home: a plain link back to the untouched page, no hash */
h1 a{color:inherit;text-decoration:none;border-bottom:0}
h1 a:hover{color:var(--grey-6)}
.switches{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.langsw{display:inline-flex;border:1px solid var(--rule)}
.langsw button{font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:var(--ls-label);
  background:none;border:0;color:var(--grey-6);padding:5px 11px;cursor:pointer}
.langsw button + button{border-left:1px solid var(--rule)}
.langsw button[aria-pressed="true"]{background:var(--invert-bg);color:var(--invert-fg)}
/* only the frozen single-file snapshot carries this; the hosted site never shows it */
.snapshot{font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;color:var(--grey-6);
  border:1px solid var(--rule);padding:8px 11px;margin:14px 0 0;max-width:78ch}
.snapshot a{color:var(--ink);border-bottom:1px solid var(--rule)}
.snapshot a:hover{border-bottom-color:var(--ink)}
.mast-sub{font-family:var(--mono);font-size:var(--fs-sm);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--grey-6);margin:16px 0 0}
.mast-stats{display:flex;gap:26px;font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--grey-6);padding-bottom:6px}
.stat-btn{background:none;border:0;padding:0 0 0 22px;margin-left:-4px;border-left:1px solid var(--rule);
  font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;text-align:left;cursor:pointer}
.stat-btn:hover b,.stat-btn[aria-pressed="true"] b{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
.stat-btn:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.mast-stats b{display:block;font-family:var(--serif-text);font-weight:500;font-size:1.6rem;line-height:1.05;letter-spacing:0;color:var(--ink);font-variant-numeric:tabular-nums}
.standfirst{max-width:78ch;margin:16px 0 0;color:var(--ink-soft);font-size:.95rem;line-height:1.55}
/* two small links on one line under the standfirst: the sources note (which opens
   in place) and the figures page */
.mast-links{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline}
.mast-links .srcdetails{margin-top:0}
.mast-links .srcdetails[open]{flex-basis:100%}
.mast-link{font-family:var(--mono);font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;color:var(--grey-6);
  border-bottom:1px solid var(--rule);padding-bottom:2px;text-decoration:none}
.mast-link:hover{color:var(--ink);border-bottom-color:var(--ink)}
.srcdetails{margin-top:12px}
.srcdetails summary{font-family:var(--mono);font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--grey-6);cursor:pointer;list-style:none;display:inline-block;border-bottom:1px solid var(--rule);padding-bottom:2px}
.srcdetails summary::-webkit-details-marker{display:none}
.srcdetails summary:hover{color:var(--ink);border-bottom-color:var(--ink)}
.srcdetails[open] summary{margin-bottom:10px}
.srcline{margin:12px 0 0;font-family:var(--mono);font-size:.7rem;line-height:1.7;letter-spacing:.02em;color:var(--grey-6);max-width:78ch}
.srcline a{border-bottom:1px solid var(--rule)}
.srcline a:hover{border-bottom-color:var(--ink);color:var(--ink)}

.histo{padding:20px 0 18px;border-bottom:1px solid var(--rule)}
.histo-head{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-bottom:16px}
.eyebrow{font-family:var(--mono);font-size:var(--fs-sm);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--grey-6)}
.bars{display:flex;gap:26px;align-items:stretch}
.cent{display:flex;flex-direction:column;gap:0;min-width:0}
.cl-abbr{display:none}
.cent-bars{display:flex;gap:4px;align-items:flex-end;flex:1}
.cent-lab{font-family:var(--mono);font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--grey-4);padding-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cent.nd .cent-lab{color:var(--grey-4)}
.cent.early{cursor:pointer}
.early-btn{width:100%;background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;
  justify-content:flex-end;gap:7px;font-family:var(--mono);font-size:.66rem;color:var(--grey-6)}
.early-btn:hover{color:var(--ink)}
.early-fill{width:100%;background:repeating-linear-gradient(90deg,var(--bar),var(--bar) 3px,transparent 3px,transparent 6px);min-height:2px}
.early-btn:hover .early-fill{background:repeating-linear-gradient(90deg,var(--ink),var(--ink) 3px,transparent 3px,transparent 6px)}
.early-lab{border-top:1px solid var(--rule);padding-top:6px;white-space:nowrap;font-size:.6rem;letter-spacing:.02em}
.early-lab::after{content:" ›";color:var(--grey-4)}
.cent.expanded .early-lab::after{content:" ‹"}
.cent-collapse{font-family:var(--mono);font-size:.7rem;align-self:flex-end;padding-bottom:18px;letter-spacing:.06em;background:none;border:0;
  color:var(--grey-4);cursor:pointer;padding:2px 0;text-align:left}
.cent-collapse:hover{color:var(--ink)}
.bar-btn{flex:1;min-width:0;background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;gap:7px;font-family:var(--mono);font-size:.66rem;color:var(--grey-6)}
.bar-fill{width:100%;background:var(--bar);min-height:2px;transition:background .15s ease;position:relative}
/* the for-sale share of a decade: hatched, at the top of the bar */
.bar-sale{position:absolute;left:0;right:0;top:0;background:repeating-linear-gradient(-45deg,var(--ink) 0 1px,transparent 1px 4px);opacity:.55}
.bar-btn:hover .bar-sale,.bar-btn[aria-pressed="true"] .bar-sale{background:repeating-linear-gradient(-45deg,var(--paper) 0 1px,transparent 1px 4px);opacity:.7}
.histo-key{font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--grey-6);display:inline-flex;align-items:center;gap:6px;margin-left:18px}
.histo-key i{display:inline-block;width:14px;height:9px;background:repeating-linear-gradient(-45deg,var(--ink) 0 1px,transparent 1px 4px);opacity:.55}
.bar-btn:hover .bar-fill,.bar-btn[aria-pressed="true"] .bar-fill{background:var(--ink)}
.bar-btn:hover,.bar-btn[aria-pressed="true"]{color:var(--ink)}
.bar-lab{border-top:1px solid var(--rule);padding-top:6px;overflow:hidden}
.bar-btn[aria-pressed="true"] .bar-lab{border-top:1px solid var(--ink)}
.bar-n{font-size:.58rem;color:var(--grey-4)}
.bar-btn.undated .bar-fill{background:repeating-linear-gradient(45deg,var(--bar),var(--bar) 2px,transparent 2px,transparent 5px)}
/* Expanded: every century's decades are on screen at once, so a 1240px rail carries
   ~60 ticks at ~20px each. A four-digit count needs more than that, and the counts
   overlap into illegibility — they retreat to each bar's tooltip, and the century
   names give way to their numerals, which do fit. */
.bars.dense .bar-n{display:none}
.bars.dense .cl-full{display:none}
.bars.dense .cl-abbr{display:inline}
.bars.dense{gap:16px}
.bars.dense .cent-bars{gap:2px}
.bars.dense .cent-lab{font-size:.62rem;letter-spacing:.08em;color:var(--grey-6)}

.yr-div{display:flex;align-items:baseline;gap:10px;font-family:var(--mono);font-size:.63rem;letter-spacing:.12em;
  color:var(--grey-4);padding:12px 0 4px 12px;margin-left:-12px;border-bottom:1px solid var(--rule)}
.yr-div b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.04em;font-size:.72rem}
.controls{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--ink);padding:12px 0;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.ctl{display:flex;align-items:center;gap:10px}
.sortsel{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
  background:var(--field);border:1px solid var(--rule);color:var(--ink);padding:7px 8px;cursor:pointer}
.seg{display:flex;border:1px solid var(--rule)}
.seg button{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;background:none;border:0;color:var(--grey-6);padding:8px 14px;cursor:pointer}
.seg button + button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--invert-bg);color:var(--invert-fg)}
.search{position:relative;flex:0 1 300px;max-width:100%}   /* a fixed-ish width: the controls after it must not shift when one of them hides */
.search input{width:100%;background:var(--field);border:1px solid var(--rule);color:var(--ink);font-family:var(--sans);font-size:.92rem;padding:9px 12px 9px 34px}
.search input::placeholder{color:var(--grey-4)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--grey-4)}
/* suggestions under the box: artists first, then works; one line each, the arrow
   keys walk them, Enter opens, Escape closes */
#sugg{position:absolute;left:0;width:max(100%,min(560px,calc(100vw - 36px)));top:calc(100% - 1px);z-index:40;background:var(--paper);border:1px solid var(--rule);
  box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:min(60vh,420px);overflow-y:auto}
#sugg .sg-h{font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--grey-4);
  padding:8px 12px 3px;border-top:1px solid var(--rule-soft)} #sugg .sg-h:first-child{border-top:0}
#sugg button{display:flex;width:100%;align-items:baseline;gap:10px;background:none;border:0;padding:6px 12px;cursor:pointer;
  text-align:left;color:var(--ink);font-family:var(--serif-text);font-size:var(--fs-base);line-height:1.3;border-radius:0}
#sugg button:hover,#sugg button[aria-selected="true"]{background:var(--field)}
#sugg button .sg-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sugg button .sg-t em{font-style:italic;font-weight:400}
#sugg button .sg-m{font-family:var(--mono);font-size:var(--fs-xs);color:var(--grey-4);white-space:nowrap;letter-spacing:.03em}
#sugg mark{background:none;color:inherit;font-weight:600}
.ctl-label{font-family:var(--mono);font-size:var(--fs-sm);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--grey-4)}
.linkbtn{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;background:none;border:0;border-bottom:1px solid var(--rule);color:var(--grey-6);cursor:pointer;padding:2px 0}
.linkbtn:hover{color:var(--ink);border-bottom-color:var(--ink)}

.sharebar{display:none;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--rule-soft);flex-wrap:wrap}
.sharebar.on{display:flex}
.sharebar input{flex:1;min-width:200px;background:var(--field);border:1px solid var(--rule);color:var(--ink);
  font-family:var(--mono);font-size:.7rem;padding:7px 9px}
.share-note{font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;color:var(--grey-4);flex-basis:100%}
.share-note b{color:var(--grey-6);font-weight:500}
.restore{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;
  background:none;border:1px solid var(--rule);color:var(--grey-6);padding:5px 10px;cursor:pointer}
.restore:hover{border-color:var(--ink);color:var(--ink)}
.filterbar{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--rule)}
.active-filters{display:flex;flex-wrap:wrap;gap:5px;min-height:1px}
.af{font-family:var(--mono);font-size:.63rem;letter-spacing:.06em;background:var(--invert-bg);color:var(--invert-fg);
  border:0;padding:4px 7px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.af:hover{opacity:.75}
.af span{opacity:.6}
.af-none{font-family:var(--mono);font-size:.63rem;letter-spacing:.06em;color:var(--grey-4)}
#filterpanel .facetbar:last-child{border-bottom:1px solid var(--rule)}
.facetbar{display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:start;padding:10px 0;border-bottom:1px solid var(--rule-soft)}
.facetbar + .facetbar{border-bottom:1px solid var(--rule)}
.facets{display:flex;flex-wrap:wrap;gap:6px}
.facet-note{font-size:.74rem;line-height:1.5;color:var(--grey-4);margin:7px 0 0;max-width:74ch}
.yrange{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.yrange select{font-family:var(--mono);font-size:.68rem;background:var(--field);border:1px solid var(--rule);
  color:var(--ink);padding:5px 6px;cursor:pointer}
.yr-dash{color:var(--grey-4);font-family:var(--mono);font-size:.7rem}
.yr-info{font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;color:var(--grey-4)}
.chip{font-family:var(--mono);font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;background:none;border:1px solid var(--rule);color:var(--grey-6);padding:5px 10px;cursor:pointer}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--invert-bg);border-color:var(--invert-bg);color:var(--invert-fg)}
.chip span{color:var(--grey-4);margin-left:6px}
.chip[aria-pressed="true"] span{color:var(--invert-fg);opacity:.6}

.row-btn:focus-visible{outline:none;background:var(--field);border-left-color:var(--ink)}
.count-line{font-family:var(--mono);font-size:var(--fs-sm);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--grey-6);padding:12px 0 0}
.group{display:grid;grid-template-columns:230px 1fr;gap:34px;padding:22px 0;border-bottom:1px solid var(--rule);
  /* a search renders up to fifty rows in each of thirty decades; the groups below the
     fold are laid out only when scrolled to, which is most of a keystroke's cost */
  content-visibility:auto;contain-intrinsic-size:auto 900px}
.group:last-child{border-bottom:0}
.gutter{position:sticky;top:66px;align-self:start}
.g-num{font-family:var(--serif-text);font-weight:500;font-size:2.9rem;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;display:block}
.g-name{font-family:var(--serif-text);font-weight:500;font-size:1.5rem;line-height:1.12;letter-spacing:-.01em;display:block;text-wrap:balance}
.g-dates{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;color:var(--grey-6);margin-top:6px}
.g-period{font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--grey-6);margin-top:10px;padding-top:8px;border-top:1px solid var(--rule)}
.g-blurb{font-size:.82rem;line-height:1.55;color:var(--grey-6);margin-top:10px;max-width:32ch}
/* ---- the mosaic: a column per century, a cell per decade, both proportional. A cell
   is a button; the pressed one is inverted, and its group renders below. Labels give
   way as cells shrink -- the count first, then the decade -- so nothing is clipped. ---- */
  font-family:var(--mono);font-size:.6rem;letter-spacing:.1em;color:var(--grey-6);white-space:nowrap;overflow:hidden;border-radius:0;
  font-variant-numeric:tabular-nums}
  font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;min-height:2px;overflow:hidden;
  display:flex;align-items:center;justify-content:space-between;gap:6px;container-type:size;font-variant-numeric:tabular-nums}
@container (max-width:88px){ .mo-cell i{display:none} }
@container (max-width:44px){ .mo-cell span{display:none} }
.gy{margin-top:16px;border-top:1px solid var(--rule);padding-top:9px}
.gy-h{font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--grey-4);margin-bottom:6px}
.gy-row{display:grid;grid-template-columns:34px 1fr 30px;gap:8px;align-items:center;width:100%;
  background:none;border:0;color:inherit;cursor:pointer;padding:2px 3px;font-family:var(--mono);font-size:.66rem;
  text-align:left;border-radius:0}
.gy-row:hover{background:var(--field)}
.gy-row[aria-pressed="true"]{background:var(--invert-bg);color:var(--invert-fg)}
.gy-row[aria-pressed="true"] .gy-bar{background:var(--invert-fg)}
.gy-row[aria-pressed="true"] .gy-n{color:var(--invert-fg)}
.gy-y{color:var(--grey-6);font-variant-numeric:tabular-nums}
/* the same rows carry artist names in the undated group: one fixed column so every
   bar starts on the same line, the rare long name trimmed rather than wrapped */
.gy-artists .gy-row{grid-template-columns:8.6em 1fr 30px}
.gy-artists .gy-y{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gy-row:hover .gy-y,.gy-row[aria-pressed="true"] .gy-y{color:inherit}
.gy-track{height:7px;background:var(--rule-soft);position:relative;overflow:hidden}
.gy-bar{position:absolute;left:0;top:0;bottom:0;background:var(--bar)}
.gy-row:hover .gy-bar{background:var(--ink)}
.gy-n{color:var(--grey-4);text-align:right;font-variant-numeric:tabular-nums;font-size:.6rem}
.und-note{font-size:.82rem;line-height:1.55;color:var(--grey-6);margin:10px 0 0;max-width:32ch}
.gy-empty{opacity:.4;cursor:default}
.gy-empty:hover{background:none}
.g-count{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--grey-4);margin-top:12px}

.rows{border-top:1px solid var(--ink)}
.row{border-bottom:1px solid var(--rule-soft);position:relative}
/* the shortlist mark: beside the row button (a button cannot hold a button), and a
   labelled version inside the open record */
.sl{position:absolute;right:0;top:3px;width:30px;height:28px;display:flex;align-items:center;justify-content:center;
  border:0;background:none;cursor:pointer;color:var(--grey-4);border-radius:2px;padding:0}
.sl svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linejoin:round}
.sl:hover{color:var(--ink);background:var(--field)}
.sl[aria-pressed="true"]{color:var(--ink)} .sl[aria-pressed="true"] svg{fill:currentColor}
.sl:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
/* a gallery row's link out, beside the shortlist mark */
.rl{position:absolute;right:34px;top:3px;height:28px;display:flex;align-items:center;padding:0 7px;border-radius:2px;
  font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.1em;text-transform:uppercase;color:var(--grey-6);white-space:nowrap}
.rl:hover{color:var(--ink);background:var(--field)}
.sl.sl-d{position:static;width:auto;height:auto;gap:7px;padding:2px 0;font-family:var(--mono);font-size:.68rem;
  letter-spacing:.04em;color:var(--grey-6);border-bottom:1px solid var(--rule);border-radius:0;background:none}
.sl.sl-d:hover{color:var(--ink);border-bottom-color:var(--ink)}
.listbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-top:var(--sp-3);padding:10px 0;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:var(--fs-base)}
.listbar b{font-weight:500} .sl-note{color:var(--grey-6);font-size:var(--fs-sm)}
#mylist[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.row-btn{width:100%;text-align:left;background:none;border:0;cursor:pointer;color:inherit;
  display:grid;grid-template-columns:98px minmax(0,1fr) 160px 88px 104px;gap:14px;align-items:baseline;
  padding:6px 118px 6px 12px;margin-left:-12px;border-left:2px solid transparent;transition:background .12s ease}
.row-btn > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-btn:hover{background:var(--field)}
.row[data-open="true"] .row-btn{border-left-color:var(--ink);background:var(--field)}
.r-year{font-family:var(--mono);font-size:.71rem;color:var(--grey-6);font-variant-numeric:tabular-nums;white-space:nowrap}
.row[data-open="true"] .r-year{color:var(--ink)}
.r-year.und{color:var(--grey-4);font-style:italic}
.r-title{font-family:var(--serif-text);font-style:italic;font-weight:420;font-size:var(--fs-lg);line-height:1.35}
.r-year.inf{color:var(--grey-4)}   /* an inferred date, marked ≈, sits a shade lighter than a museum's */
.r-artist{font-family:var(--sans);font-style:normal;font-size:.76rem;color:var(--ink-soft)}
.r-alink{cursor:pointer;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;transition:text-decoration-color .15s} .d-v .r-alink{text-decoration-color:var(--grey-4)} .r-alink:hover{text-decoration-color:var(--grey-4);color:var(--ink)}
.r-med,.r-coll{font-family:var(--mono);font-size:.64rem;letter-spacing:var(--ls-data);color:var(--grey-6);line-height:1.35}
.r-sub{display:block;color:var(--grey-4);font-size:.6rem}
.r-coll{color:var(--grey-4)}
.src-tag{font-family:var(--mono);font-size:.52rem;letter-spacing:.08em;color:var(--grey-4);border:1px solid var(--rule);padding:0 3px;margin-left:5px;vertical-align:1px}

.detail{padding:2px 0 22px 12px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:34px}
.d-note{font-family:var(--serif-text);font-size:1rem;line-height:1.62;max-width:64ch;color:var(--ink-soft)}
/* the museum's image of a public-domain work: a third column, the picture at its own
   proportions, never wider than a column, with the holder named beneath */
.detail.has-fig{grid-template-columns:minmax(200px,300px) minmax(0,1fr) 300px}
.d-fig{margin:4px 0 0}
.d-fig img{display:block;max-width:100%;max-height:420px;width:auto;height:auto;background:var(--field)}
.d-fig figcaption{font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.06em;color:var(--grey-4);margin-top:8px;line-height:1.5}
@media(max-width:1080px){.detail.has-fig{grid-template-columns:minmax(0,1fr) 300px}.d-fig{grid-column:1/-1}.d-fig img{max-height:360px}}
@media(max-width:860px){.detail.has-fig{grid-template-columns:1fr}}
/* works that look like this: a row of six small tiles under the record, spanning the grid */
.la{grid-column:1/-1;border-top:1px solid var(--rule);padding-top:12px;margin-top:4px}
.la-row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:8px}
.la-t{display:block;text-decoration:none;color:inherit;min-width:0}
/* each tile in a frame of one height, the picture standing on its floor at the work's own
   shape -- a tall sheet narrow, a wide canvas full width -- so the captions line up */
.la-fr{display:flex;align-items:flex-end;height:150px}
.la-t img,.la-t .wt-ph{display:block;max-width:100%;max-height:150px;width:auto;object-fit:cover;object-position:center;background:var(--field)}
.la-t .wt-ph{width:100%}
.la-cap{display:block;font-family:var(--mono);font-size:.62rem;line-height:1.4;color:var(--grey-4);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.la-cap i{font-family:var(--serif-text);font-style:italic;font-size:.78rem;color:var(--ink-soft);display:block;overflow:hidden;text-overflow:ellipsis}
.la-t:hover .la-cap i{text-decoration:underline}
@media(max-width:860px){.la-row{grid-template-columns:repeat(3,minmax(0,1fr))}.la-fr{height:110px}.la-t img,.la-t .wt-ph{max-height:110px}}
.d-nolabel{font-family:var(--mono);font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;color:var(--grey-4);display:block;margin-bottom:6px}
.d-side{border-top:1px solid var(--rule);padding-top:12px}
.d-k{font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--grey-4)}
.d-v{font-size:.85rem;line-height:1.5;margin:3px 0 11px}
.d-v em{font-style:normal;color:var(--grey-6);font-size:.78rem}
.members{margin-top:18px;border-top:1px solid var(--rule);padding-top:11px}
.mem-head{font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--grey-4);margin-bottom:8px}
.mem-list{max-height:260px;overflow-y:auto;border:1px solid var(--rule-soft)}
/* the links column is fixed: "MuIS · EKM" on one row and "EKM" on the next must not
   move the technique column between them */
.mem-row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 84px;gap:12px;align-items:baseline;
  padding:5px 9px;border-bottom:1px solid var(--rule-soft);font-family:var(--mono);font-size:.65rem;line-height:1.3}
.mem-row:last-child{border-bottom:0}
.mem-row:nth-child(odd){background:var(--field)}
.mem-num{color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem-tech{color:var(--grey-6);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem-row > span:last-child{text-align:right;white-space:nowrap}
.mem-row a{color:var(--grey-4);border-bottom:1px solid var(--rule)}
.mem-row a:hover{color:var(--ink);border-bottom-color:var(--ink)}
.d-bio{font-size:.83rem;line-height:1.55;color:var(--grey-6);border-top:1px solid var(--rule);padding-top:10px;margin-top:4px}
.tag{font-family:var(--mono);font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--rule);color:var(--grey-4);padding:1px 5px;margin-left:6px;white-space:nowrap}
.permalink{font-family:var(--mono);font-size:.68rem;letter-spacing:.04em;border-bottom:1px solid var(--rule);color:var(--grey-6)}
.permalink:hover{color:var(--ink);border-bottom-color:var(--ink)}
.empty{padding:70px 0;text-align:center;color:var(--grey-6);font-family:var(--serif-text);font-size:1.2rem;font-style:italic}
/* ---- the picture wall: the works of the view that have a picture, as a masonry of
   tiles; the works without follow in the ordinary list. Columns, not a grid: a
   painting keeps its own proportions. */
.wall-bar{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;color:var(--grey-6);padding:14px 0 12px;border-top:1px solid var(--rule);line-height:1.6}
.wall-bar u{text-decoration:none;color:var(--ink-soft)}
.cr-note{font-family:var(--sans);font-size:.82rem;letter-spacing:0;color:var(--grey-6);border-top:0;padding-top:4px}
.wall{display:flex;gap:10px;align-items:flex-start;margin:0 0 22px}
.wcol{flex:1 1 0;min-width:0}
.wt{display:block;width:100%;margin:0 0 10px;padding:0;border:0;background:var(--field);text-align:left;cursor:pointer;color:inherit;font:inherit}
.wt{overflow:hidden}
.wt img{display:block;width:100%;height:auto;object-fit:cover;object-position:center;background:var(--field)}
/* a photograph taller than the work it shows carries a colour chart above or below it;
   the tile takes the work's shape and looks at the middle, so either edge falls off */
.wt img.zm{transform:none}   /* no zoom: a frame is cropped evenly, a chart at one edge half-cropped, nothing of the work lost */
.wt-ph{display:block;width:100%}
.wt-cap{display:block;font-size:.72rem;line-height:1.3;color:var(--ink-soft);padding:6px 5px 6px}
.wt-cap i{display:block;font-family:var(--serif-text);font-style:italic;font-size:.88rem;color:var(--ink)}
.wt.on{outline:2px solid var(--ink);outline-offset:1px} .wt:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.wall-open{margin:0 0 18px} .wall-open .row{border-top:1px solid var(--rule)}
.v-n{opacity:.55;font-size:.9em;margin-left:4px}
/* the artwall button is pastel green while the wall is NOT showing -- the one coloured control on
   the page, there to draw the eye to the pictures a list is hiding; pressed, it is the
   ordinary inverted button like its neighbours */
#v-wall[aria-pressed="false"]{background:#77dd77;color:#0B0C0E} #v-wall[aria-pressed="false"] .v-n{opacity:.75}
.more{width:100%;background:none;border:0;border-top:1px dashed var(--rule);color:var(--grey-6);font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;padding:11px;cursor:pointer}
.more:hover{color:var(--ink);background:var(--field)}

footer{border-top:1px solid var(--ink);margin-top:10px;padding:30px 0 60px;display:grid;grid-template-columns:repeat(3,1fr);gap:34px}
footer p{margin:0;font-size:.81rem;line-height:1.6;color:var(--grey-6);max-width:46ch}
/* the A-Z link is one line; left in a grid cell beside three long notes it sat at
   the top of a tall row with a void beneath it. It takes a row of its own. */
footer p:first-child{grid-column:1/-1;max-width:none;margin-bottom:-12px}
footer b{color:var(--ink);font-weight:500}
footer a{border-bottom:1px solid var(--rule)}


/* ---------- artist index ---------- */
.aidx{border-bottom:1px solid var(--rule);padding:11px 0}
.ai-head{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}
.ai-rail{display:flex;flex-wrap:wrap;gap:2px}
.ai-l{font-family:var(--mono);font-size:.7rem;background:none;border:0;color:var(--grey-4);padding:3px 5px;cursor:pointer;line-height:1}
.ai-l:hover{color:var(--ink);background:var(--field)}
.ai-l[aria-pressed="true"]{background:var(--invert-bg);color:var(--invert-fg)}
.ai-tools{display:flex;align-items:center;gap:12px}
.ai-sort{display:inline-flex;border:1px solid var(--rule)}
.ai-sort button{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;
  background:none;border:0;color:var(--grey-6);padding:5px 9px;cursor:pointer;white-space:nowrap}
.ai-sort button + button{border-left:1px solid var(--rule)}
.ai-sort button[aria-pressed="true"]{background:var(--invert-bg);color:var(--invert-fg)}
.ai-search{background:var(--field);border:1px solid var(--rule);color:var(--ink);
  font-family:var(--sans);font-size:.8rem;padding:5px 9px;width:180px}
.ai-search::placeholder{color:var(--grey-4)}
.ai-count{column-span:all;font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:var(--ls-label);
  text-transform:uppercase;color:var(--grey-4);padding-bottom:4px}
/* An index is read down, not across — dictionaries, phone books and back-of-book
   indexes all run in columns for that reason. Newspaper columns keep consecutive
   names vertically adjacent; a grid would put them side by side and make scanning
   alphabetically a left-right zigzag. */
.ai-body{margin-top:16px;border-top:1px solid var(--rule-soft);padding-top:14px;
  column-width:268px;column-gap:26px}
.ai-body .ai-item{break-inside:avoid}
/* Ranked by size, consecutive ranks must sit next to each other. A CSS grid fills
   row-major, so 1-2-3-4 would run across the top and rank 5 would jump back to the
   far left; newspaper columns run them down, which also stacks the counts in a line
   you can compare. A-Z keeps the grid, whose letter dividers span all columns. */
.ai-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;
  background:none;border:0;border-bottom:1px solid var(--rule-soft);color:inherit;
  text-align:left;padding:7px 4px;cursor:pointer;font-family:inherit}
.ai-item:hover{background:var(--field)}
.ai-nm{font-size:.86rem;line-height:1.3}
.ai-dt{font-family:var(--mono);font-size:.62rem;color:var(--grey-4);letter-spacing:.04em}
.ai-rt{display:flex;align-items:center;gap:9px;justify-content:flex-end}
.ai-n{font-family:var(--mono);font-size:.66rem;color:var(--grey-6);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.spark{color:var(--bar);display:block}
.ai-item:hover .spark{color:var(--ink)}
/* the heading sits inline in its column, as in a printed index, and never strands
   itself at the foot of one */
.ai-letter{font-family:var(--sans);font-weight:600;font-size:1.15rem;
  break-after:avoid;break-inside:avoid;letter-spacing:.04em;line-height:1;
  padding:16px 0 5px;border-bottom:1px solid var(--ink);margin-bottom:3px}
.ai-letter:first-child{padding-top:0}

/* ---------- single artist view ---------- */
.mono{border-bottom:1px solid var(--ink);padding:30px 0 26px;
  display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:44px;align-items:start}
.mono-back{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
  background:none;border:0;border-bottom:1px solid var(--rule);color:var(--grey-6);cursor:pointer;
  padding:2px 0;margin-bottom:18px}
.mono-back:hover{color:var(--ink);border-bottom-color:var(--ink)}
.mono h2{font-family:var(--serif-text);font-weight:500;font-size:clamp(1.9rem,4.4vw,2.9rem);
  line-height:1.02;letter-spacing:-.015em;margin:0;text-wrap:balance}
.mono-dates{font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;color:var(--grey-6);margin-top:9px}
.mono-bio{font-family:var(--serif-text);font-size:.98rem;line-height:1.62;color:var(--ink-soft);max-width:64ch;margin:15px 0 0}
.mono-bio.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.g-blurb.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.g-more{margin-top:6px}
.bio-more{font-family:var(--mono);font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;background:none;
  border:0;border-bottom:1px solid var(--rule);color:var(--grey-6);cursor:pointer;padding:2px 0;margin-top:9px}
.bio-more:hover{color:var(--ink);border-bottom-color:var(--ink)}
/* similar artists: for the reader who liked the style -- chips that open the next
   artist; the label's tooltip says what "similar" was measured on */
.mono-sim{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:18px}
.mono-simlab{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--grey-6);margin-right:6px;cursor:help;border-bottom:1px dotted var(--grey-4)}
.sim-chip{font-family:var(--serif-text);font-size:.95rem;color:var(--ink);background:none;border:1px solid var(--rule);padding:4px 10px;cursor:pointer;line-height:1.2}
.sim-chip span{font-family:var(--mono);font-size:.62rem;color:var(--grey-6);margin-left:7px}
.sim-chip:hover{border-color:var(--ink)}
.mono-links{display:flex;flex-wrap:wrap;gap:18px;margin-top:16px}
.mono-side{border-top:1px solid var(--ink);padding-top:13px}
.mono-fig{font-family:var(--serif-text);font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.mono-figlab{font-family:var(--mono);font-size:.62rem;letter-spacing:.13em;text-transform:uppercase;color:var(--grey-6);margin-top:3px}
.mono-au{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;color:var(--grey-6);margin-top:10px;padding-top:8px;border-top:1px solid var(--rule);font-variant-numeric:tabular-nums}
/* an auction row's link states the outcome; an unsold lot in the quieter grey */
.rl-au{font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.04em}
/* the columns must line up with every other row; the price alone fits the same gutter */
.rl-au.unsold{color:var(--grey-4)}
.rl-past{color:var(--grey-4)}
.d-sub{font-size:.78rem;color:var(--grey-6)}
/* a work's results in order, the latest (the one this row is) in ink */
.au-hist{margin-top:8px;font-family:var(--mono);font-size:.7rem;border-top:1px solid var(--rule)}
.au-row{display:grid;grid-template-columns:38px 1fr auto 16px;gap:8px;padding:4px 0;border-bottom:1px solid var(--rule-soft);color:var(--grey-6)}
.au-doubt{font-family:var(--sans);font-size:.74rem;color:var(--grey-5);padding:2px 0 6px 46px;border-bottom:1px solid var(--rule-soft);line-height:1.4}
.au-row.now{color:var(--ink)} .au-row .n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums} .au-row em{font-style:normal;color:var(--grey-4)}
.au-row span:nth-child(2){line-height:1.35} .au-row a{color:var(--grey-4)}
.mono-tl{margin-top:20px}
.mono-tl .spark{color:var(--ink);width:100%;height:44px}
.mono-ticks{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;font-family:var(--mono);font-size:.56rem;letter-spacing:.03em;color:var(--grey-4);margin-top:3px}
.mono-ticks span{overflow:hidden;white-space:nowrap}
.mono-axis{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:.6rem;
  color:var(--grey-4);border-top:1px solid var(--rule);padding-top:5px;margin-top:3px}
.mono-axis span:nth-child(2){color:var(--grey-6)}
.mono-med{margin-top:18px;font-family:var(--mono);font-size:.66rem;line-height:1.9;color:var(--grey-6)}
.mono-med b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.showartist{font-family:var(--mono);font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;
  background:none;border:1px solid var(--rule);color:var(--grey-6);padding:5px 9px;cursor:pointer;margin-top:11px}
.showartist:hover{border-color:var(--ink);color:var(--ink)}
@media (max-width:860px){
  .ai-head{grid-template-columns:1fr;gap:10px}
  .mono{grid-template-columns:1fr;gap:24px}
  .mono-side{border-top:1px solid var(--rule)}
}

@media (max-width:1080px){ .row-btn{grid-template-columns:94px minmax(0,1fr) 142px 88px} .r-coll{display:none} footer{grid-template-columns:1fr 1fr} }
@media (max-width:880px){ .row-btn{grid-template-columns:90px minmax(0,1fr) 132px} .r-med{display:none} }
@media (max-width:860px){
  .wrap{padding:0 18px}
  .mast-grid{grid-template-columns:1fr}
  .group{grid-template-columns:1fr;gap:16px}
  .mosaic{--moh:260px;--mohh:44px;--mow:42px;gap:2px}
  .mo-h b{font-size:.8rem}
  /* five figures in a row are 478px; on a phone the fifth wraps rather than the page widening */
  .mast-stats{flex-wrap:wrap;gap:14px 22px}
  .gutter{position:static}
  .g-blurb{max-width:60ch}
  .row-btn{grid-template-columns:86px minmax(0,1fr);gap:10px;padding-top:7px;padding-bottom:7px}
  .r-artist{grid-column:2;font-size:.72rem}
  .r-med,.r-coll{display:none}
  .detail{grid-template-columns:1fr;gap:18px}
  .facetbar{grid-template-columns:1fr;gap:8px}
  footer{grid-template-columns:1fr}
}
/* 40+ decade ticks collide long before the page itself gets narrow */
@media (max-width:1000px){
  .bar-lab{font-size:0;border-top:1px solid var(--rule);padding-top:6px;min-height:1px}
  .cent-lab{padding-top:5px}
}
/* Touch targets. WCAG 2.5.8 asks for 24x24 minimum; on a phone the year rows were
   18px tall, the letter rail 17x17 and the text buttons 19px. Widened only here, so
   the denser desktop layout is untouched. The histogram bars are the one exception:
   24 decades across a 375px screen cannot each be 24px wide, so they stay narrow and
   the century label above them remains the coarse, reliable target. */
@media (pointer:coarse), (max-width:760px){
  .gy-row{min-height:32px;padding:6px 3px}
  .ai-l{min-width:32px;min-height:32px;display:inline-flex;align-items:center;justify-content:center}
  .linkbtn{min-height:32px;display:inline-flex;align-items:center}
  .early-btn,.cent-collapse{min-height:32px}
  /* the language and theme toggles land at 23px — one pixel short of the minimum */
  .langsw button,.seg button,.ai-sort button{min-height:32px}
  .af{min-height:32px}   /* the active-filter chips are how a filter gets removed */
}
/* A phone: the toolbar took a third of the screen and stayed stuck there. It scrolls
   with the page, the GROUP / SORT / SHOW labels go, and the four masthead figures sit
   two by two instead of three and one. */
@media (max-width:640px){
  .controls{position:static;padding:10px 0;gap:8px 12px}
  .ctl-label{display:none}
  .search{flex:1 1 100%;max-width:none}
  .sortsel{max-width:150px}
  .mast-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
  .mast-stats > *{border:0!important;padding:0!important}
  .seg button{padding:8px 11px;font-size:.64rem;letter-spacing:.08em}
  .d-fig{grid-column:1/-1}
}
@media (max-width:760px){
  .bar-n{display:none}
  .bars{gap:12px}
  .cent-bars{gap:2px}
  .cent-lab{font-size:.55rem;letter-spacing:.06em}
  .cl-full{display:none}
  .cl-abbr{display:inline}
}
/* Serif faces thin out on a dark ground — carry a little more weight there */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .r-title{font-weight:450}
  :root:not([data-theme="light"]) .mono h2{font-weight:550}
}
:root[data-theme="dark"] .r-title{font-weight:450}
:root[data-theme="dark"] .mono h2{font-weight:550}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.doors{border-top:1px solid var(--rule);margin:var(--sp-4) 0 0;padding-top:var(--sp-3)}
.doors .d-names ul{columns:2;column-gap:var(--sp-4)} .doors .d-names li{break-inside:avoid}
@media(min-width:1100px){.doors .d-names ul{columns:4}}
@media(max-width:760px){.doors .d-names ul{columns:1}}

.g-split{font-family:var(--mono);font-size:var(--fs-sm);letter-spacing:var(--ls-data);color:var(--grey-6);margin-top:6px;font-variant-numeric:tabular-nums}
/* era band under the histogram: positioned against the decade cells on wide screens,
   a plain wrapped row where the cells are too narrow to label */
.eras{position:relative;height:24px;margin-top:6px}
.era{position:absolute;top:0;height:22px;box-sizing:border-box;padding:4px 2px 0;text-align:left;
  font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.04em;text-transform:uppercase;
  color:var(--grey-6);background:none;border:0;border-top:2px solid var(--rule);cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.era:hover{color:var(--ink);border-top-color:var(--ink)}
.era[aria-pressed="true"]{color:var(--ink);border-top-color:var(--ink)}
.era:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
@media(max-width:1000px){
  .eras{height:auto;display:flex;flex-wrap:wrap;gap:4px 14px}
  .era{position:static!important;width:auto!important;left:auto!important;height:auto;
    border-top:0;border-bottom:1px solid var(--rule);padding:2px 0;overflow:visible}
}
.doors h2{font-family:var(--mono);font-size:var(--fs-sm);letter-spacing:var(--ls-label);
  text-transform:uppercase;color:var(--grey-6);font-weight:400;margin:0 0 var(--sp-2)}
.doors ul{list-style:none;margin:0;padding:0}
.doors button{display:flex;width:100%;align-items:baseline;justify-content:space-between;
  gap:var(--sp-2);background:none;border:0;border-bottom:1px solid var(--rule-soft);
  padding:5px 0;min-height:24px;cursor:pointer;text-align:left;color:var(--ink);
  font-family:var(--serif-text);font-size:var(--fs-md)}
.doors button:hover{background:var(--raise)}
.doors button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.doors .n{font-family:var(--mono);font-size:var(--fs-sm);color:var(--grey-4);
  font-variant-numeric:tabular-nums;flex:none}
@media(max-width:760px){.doors{grid-template-columns:1fr;gap:var(--sp-3)}}
</style>

<div class="wrap">
  <header class="masthead">
    <div class="mast-grid">
      <div>
        <h1><a href="./" data-i18n-html="wordmark"></a></h1>
        <div class="switches">
          <div class="langsw" role="group" aria-label="Language">
            <button id="lang-en" aria-pressed="true">ENG</button>
            <button id="lang-et" aria-pressed="false">EST</button>
          </div>
          <div class="langsw themesw" role="group" aria-label="Theme">
            <button id="th-auto" aria-pressed="true" data-i18n="th_auto"></button>
            <button id="th-light" aria-pressed="false" data-i18n="th_light"></button>
            <button id="th-dark" aria-pressed="false" data-i18n="th_dark"></button>
          </div>
        </div>
        <p class="mast-sub" data-i18n="sub"></p>
      </div>
      <div class="mast-stats">
        <div><b id="stat-w">0</b><span data-i18n="works"></span></div>
        <div><b id="stat-a">0</b><span data-i18n="artists"></span></div>
        <!-- museums and galleries are counted in the sources note, not here: four
             figures read as a masthead, six as a table -->
        <div id="stat-mwrap" hidden><b id="stat-m">0</b><span data-i18n="museums"></span></div>
        <div id="stat-gwrap" hidden><b id="stat-g">0</b><span data-i18n="galleries"></span></div>
        <!-- the one stat that is a door: the works a visitor can actually acquire -->
        <button class="stat-btn" id="stat-sale" hidden><b id="stat-s">0</b><span data-i18n="forsale"></span></button>
        <!-- and the other thing a visitor can act on: what the auction record says -->
        <button class="stat-btn" id="stat-auc" hidden><b id="stat-au">0</b><span data-i18n="auctioned"></span></button>
      </div>
    </div>
    <p class="standfirst" data-i18n-html="standfirst"></p>
    <div class="mast-links">
      <a class="mast-link" href="stats.html" data-i18n="statslink"></a>
      <details class="srcdetails">
        <summary data-i18n="srcsummary"></summary>
        <p class="srcline" data-i18n-html="srcline"></p>
      </details>
    </div>
  </header>

  <section class="histo">
    <div class="histo-head">
      <span><span class="eyebrow" data-i18n="worksperdecade"></span></span>
      <span class="eyebrow" id="histo-hint">Select a decade to filter</span>
    </div>
    <div class="bars" id="bars"></div>
    <div class="eras" id="eras"></div>
  </section>

  <div class="controls">
    <div class="search">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4L14 14"/></svg>
      <input id="q" type="search" placeholder="Search titles, artists, techniques, inventory numbers…" aria-label="Search the register"
             autocomplete="off" role="combobox" aria-expanded="false" aria-controls="sugg" aria-autocomplete="list">
      <div id="sugg" role="listbox" hidden></div>
    </div>
    <div class="ctl">
      <span class="ctl-label" data-i18n="group"></span>
      <div class="seg" role="group" aria-label="Group by">
        <button id="g-decade" aria-pressed="true" data-i18n="decade"></button>
        <button id="g-artist" aria-pressed="false" data-i18n="artist"></button>
        <button id="g-auc" aria-pressed="false" data-i18n="auctions"></button>
      </div>
    </div>
    <div class="ctl">
      <span class="ctl-label" data-i18n="sort"></span>
      <select id="sortby" class="sortsel" aria-label="Sort rows by">
        <option value="year" data-i18n="s_year"></option>
        <option value="artist" data-i18n="s_artist"></option>
        <option value="title" data-i18n="s_title"></option>
        <option value="medium" data-i18n="s_medium"></option>
        <option value="museum" data-i18n="s_museum"></option>
        <option value="price" data-i18n="s_price"></option>
      </select>
      <div class="seg" role="group" aria-label="Order">
        <button id="o-asc" aria-pressed="true">Earliest</button>
        <button id="o-desc" aria-pressed="false">Latest</button>
      </div>
    </div>
    <div class="ctl" id="viewctl" hidden>
      <span class="ctl-label" data-i18n="show"></span>
      <div class="seg" role="group" aria-label="View">
        <button id="v-list" aria-pressed="true" data-i18n="v_list"></button>
        <button id="v-wall" aria-pressed="false"></button>
      </div>
    </div>
    <button class="linkbtn" id="filters-toggle" aria-expanded="false" aria-controls="filterpanel">Show filters</button>
    <button class="linkbtn" id="mylist" aria-pressed="false"></button>
    <button class="linkbtn" id="share" data-i18n="linkview"></button>
    <button class="linkbtn" id="reset" data-i18n="reset"></button>
  </div>

  <div class="sharebar" id="sharebar">
    <input id="shareurl" readonly aria-label="Link to this view">
    <button class="linkbtn" id="sharecopy" data-i18n="copy"></button>
    <span class="share-note" id="sharenote"></span>
  </div>

  <div class="filterbar">
    <span class="ctl-label" data-i18n="filters"></span>
    <div class="active-filters" id="activefilters"></div>
  </div>
  <div id="filterpanel" hidden>
  <div class="facetbar"><span class="ctl-label" data-i18n="years"></span>
    <div class="facets" id="f-years">
      <div class="yrange">
        <select id="yr-from" aria-label="From year"></select>
        <span class="yr-dash">&ndash;</span>
        <select id="yr-to" aria-label="To year"></select>
        <button class="chip" id="yr-undated" aria-pressed="false"><span data-i18n="undated"></span><span id="yr-und-n"></span></button>
        <button class="linkbtn" id="yr-reset" data-i18n="anyyear"></button>
        <span class="yr-info" id="yr-info"></span>
      </div>
    </div>
  </div>
  <div class="facetbar"><span class="ctl-label" data-i18n="medium"></span><div class="facets" id="f-med" role="group" aria-label="Filter by medium"></div></div>
  <div class="facetbar"><span class="ctl-label" data-i18n="museum"></span><div class="facets" id="f-mus" role="group" aria-label="Filter by museum"></div></div>
  <div class="facetbar"><span class="ctl-label" data-i18n="ekmcat"></span><div class="facets" id="f-cat" role="group" aria-label="Filter by EKM collection category"></div></div>
  <div class="facetbar"><span class="ctl-label" data-i18n="origin"></span><div><div class="facets" id="f-org" role="group" aria-label="Filter by artist citizenship"></div><p class="facet-note" data-i18n="originnote"></p></div></div>
  <div class="facetbar"><span class="ctl-label" data-i18n="training"></span><div><div class="facets" id="f-grp" role="group" aria-label="Filter by training or movement"></div><p class="facet-note" data-i18n="trainingnote"></p></div></div>
  <div class="facetbar"><span class="ctl-label" data-i18n="source"></span><div class="facets" id="f-src" role="group" aria-label="Filter by source catalogue"></div></div>
  </div>

  <section class="aidx" id="aidx">
    <div class="ai-head">
      <span class="eyebrow" data-i18n="artistindex"></span>
      <nav class="ai-rail" id="ai-rail" aria-label="Jump to artists by letter"></nav>
      <div class="ai-tools">
        <div class="ai-sort" role="group" aria-label="Sort artists">
          <button id="ais-az" aria-pressed="true" data-i18n="sortaz"></button>
          <button id="ais-works" aria-pressed="false" data-i18n="sortworks"></button>
        </div>
        <input id="ai-q" class="ai-search" type="search" aria-label="Filter artists">
        <button class="linkbtn" id="ai-toggle" aria-expanded="false" aria-controls="ai-body"></button>
      </div>
    </div>
    <div class="ai-body" id="ai-body" hidden></div>
  </section>

  <div id="mono"></div>
  <p class="count-line" id="countline"></p>

  <section class="doors" id="doors" hidden></section>
  <div class="listbar" id="listbar" hidden></div>

  <main id="register"></main>

  <footer>
    <!-- static, not i18n: a crawler never runs the app, and this is the route into
         the per-artist pages that make the catalogue findable at all -->
    <p><a href="a/">Artists A–Z / Kunstnikud A–Ü</a> — every artist as a plain page.</p>
    <p data-i18n-html="foot1"></p>
    <p data-i18n-html="foot2"></p>
    <p data-i18n-html="foot3"></p>
  </footer>
</div>
