  function groupHTML(key, gutter, items, showArtist){
    const LIMIT = state.group === "artist" ? LIMIT_ART : LIMIT_DEC;
    const gk = String(key);                       // dataset values are always strings
    const n = items.length, exp = state.expand.has(gk);
    const shown = exp ? items : items.slice(0, LIMIT);
    const divide = state.group === "decade" && state.sort === "year"
                   && state.year === null && gk !== "und";
    const more = (!exp && n > LIMIT)
      ? `<button class="more" data-exp="${esc(gk)}">${esc(T("showallentries",{n:fmt(n)}))}</button>` : "";
    return `<section class="group" id="grp-${esc(key)}">
      <div class="gutter">${gutter}<div class="g-count">${n} ${esc(n===1?T("entry"):T("entries"))}</div></div>
      <div class="rows">${(() => {
        if (!divide) return shown.map(w=>rowHTML(w, showArtist)).join("");
        let last = null, out = "";
        const yearTally = new Map();
        for (const x of items) yearTally.set(x.y, (yearTally.get(x.y) || 0) + 1);
        shown.forEach(w => {
          if (w.y !== last){
            last = w.y;
            const c = yearTally.get(w.y) || 0;
            out += `<div class="yr-div"><b>${w.y==null?"n.d.":w.y}</b><span>${esc(c===1?T("oneworkc"):T("nworks",{n:c}))}</span></div>`;
          }
          out += rowHTML(w, showArtist);
        });
        return out;
      })()}${more}</div>
    </section>`;
  }

  // The three centuries before 1700 hold 247 works between them; as columns of their
  // own they would be hairlines. They share one, as they share an era on the band.
  // Every column and cell keeps a floor width so the small ones can still be read
  // and clicked -- the printed count, not the area, is the figure.
  function mosaicHTML(keys, cnt){
    const cols = [];
    for (const d of keys){
      const c = d === "und" ? "und" : d < 1700 ? "pre" : Math.floor(d/100) + 1, last = cols[cols.length-1];
      if (last && last.c === c) last.ds.push(d); else cols.push({c, ds:[d]});
    }
    cols.forEach(c => c.n = c.ds.reduce((n, d) => n + cnt(d), 0));
    // Column widths follow the square root of the count, as a bubble's radius does:
    // the 20th century holds 56% of the works and would otherwise be 56% of the
    // width, with everything else squeezed beside it. The cells inside a column are
    // linear -- a column is a bar, and its decades divide it.
    const total = cols.reduce((n, c) => n + Math.sqrt(c.n), 0) || 1;
    // Proportions are grid tracks in fr, so the gaps come off the top and the shares
    // stay exact; the floors are pixel minimums the stylesheet sets for the viewport.
    // (shares as percentages: a grid treats fr factors that sum below 1 as summing to 1,
    // and would leave the remainder of the width empty)
    const colsTpl = cols.map(c => `minmax(var(--mow),${(100 * Math.sqrt(c.n) / total).toFixed(2)}fr)`).join(" ");
    return `<div class="mosaic" role="group" aria-label="${esc(T("mosaic_aria"))}" style="grid-template-columns:${colsTpl}">` + cols.map(c => {
      const lab = c.c === "und" ? T("nd") : c.c === "pre" ? "<1700" : ordN(c.c);
      const full = c.c === "und" ? T("undated") : c.c === "pre" ? T("p_pre") : T("century", {n: ordN(c.c)});
      const span = c.c === "und" ? "und," : c.c === "pre" ? ",1699" : `${(c.c-1)*100},${(c.c-1)*100+99}`;
      // Before 1700 the decades are 23 slivers of a few works each; that column is
      // cut by century instead, and a cell opens every decade it holds.
      const units = c.c === "pre"
        ? [...new Set(c.ds.map(d => Math.floor(d/100)))].map(h => ({ds: c.ds.filter(d => Math.floor(d/100) === h), lab: ordN(h+1), full: T("century", {n: ordN(h+1)})}))
        : c.ds.map(d => ({ds: [d], lab: d === "und" ? T("undated") : d + "s"}));
      units.forEach(u => u.n = u.ds.reduce((n, d) => n + cnt(d), 0));
      // 14px is one line of label: every decade gets its name, the thinnest a little over-stated
      const rowsTpl = units.map(u => `minmax(14px,${(100 * u.n / (c.n || 1)).toFixed(2)}fr)`).join(" ");
      const cells = units.map(u => {
        const on = u.ds.every(d => state.od.has(String(d)));
        return `<button class="mo-cell" data-od="${u.ds.join(",")}" aria-pressed="${on}"
          title="${esc(u.full || u.lab)} · ${esc(u.n===1?T("oneworkc"):T("nworks",{n:fmt(u.n)}))}"><span>${esc(u.lab)}</span><i>${fmt(u.n)}</i></button>`;
      }).join("");
      return `<div class="mo-col${c.c==="und"?" und":""}">
        <button class="mo-h" data-span="${span}" title="${esc(full)} · ${esc(T("nworks",{n:fmt(c.n)}))}"><b>${esc(lab)}</b><span>${fmt(c.n)}</span></button>
        <div class="mo-cells" style="grid-template-rows:${rowsTpl}">${cells}</div></div>`;
    }).join("") + `</div>`;
  }

  function render(){
    renderDoors(); renderListBar();
    // The count line and Reset describe and undo a selection; before there is one
    // they only repeat the masthead.
    $("countline").hidden = pristine(); $("reset").hidden = pristine();
    // The A-Ü rail is the index for the artist-grouped view. On the decade view it was
    // a third way into artists beside search and the names door.
    $("aidx").hidden = state.group !== "artist" && !state.idxOpen && state.letter === null;
    const set = fullSet();
    $("stat-w").textContent = fmt(W.length);
    $("stat-a").textContent = fmt(STATS.artists);
    $("stat-m").textContent = fmt(STATS.museums);
    $("stat-g").textContent = fmt(STATS.galleries);
    $("stat-gwrap").hidden = STATS.galleries === 0;
    // Everything a gallery is selling right now, museum-held artist or not. It sits
    // beside the counts because it is the one thing here a visitor can act on.
    $("stat-s").textContent = fmt(FOR_SALE);
    $("stat-sale").hidden = FOR_SALE === 0;
    $("stat-sale").setAttribute("aria-pressed", state.sale);

    const scope = [];
    if (state.shared) scope.push(T("sl_shared", {n: state.shared.size}));
    else if (state.list) scope.push(T("mylist"));
    if (state.cross) scope.push(T("doors_cross"));
    if (state.sale) scope.push(T("forsale_chip"));
    if (state.artist!==null) scope.push(A[state.artist].n);
    if (state.undOnly) scope.push(T("undated"));
    else if (state.from !== null || state.to !== null)
      scope.push(`${state.from ?? YEARS.min}–${state.to ?? YEARS.max}`);
    if (state.q) scope.push(`“${state.q}”`);
    if (state.decade!==null) scope.push(state.decade==="und" ? T("undated") : (state.year!==null ? String(state.year) : state.decade+"s"));
    if (state.media.size) scope.push([...state.media].map(medName).join(" + "));
    if (state.museums.size) scope.push([...state.museums].map(abbr).join(" + "));
    if (state.cats.size) scope.push([...state.cats].map(catName).join(" + "));
    if (state.srcs.size) scope.push([...state.srcs].map(s=>SRCLAB[s]||s).join(" + "));
    if (state.origins.size) scope.push([...state.origins].map(o=>o===NOORIGIN?T("originunknown"):o).join(" + "));
    if (state.groups.size) scope.push([...state.groups].map(grpLabel).join(" + "));
    $("countline").textContent = T("ofworks",{a:fmt(set.length),b:fmt(W.length)}) +
      (scope.length ? " · " + scope.join(" · ") : " · " + T("complete"));

    if (!set.length){ reg.innerHTML = `<p class="empty">${esc(T("noresults"))}</p>`; return; }
    if (state.group === "timeline"){ reg.innerHTML = renderTimeline(set); return; }
    if (state.group === "auction"){ reg.innerHTML = renderAuctions(set); return; }

    let html = "";
    const BASE = baseSet();          // hoisted: was recomputed once per decade
    // ...and bucket both by decade in one pass. These were being filtered once per
    // decade key — 57 keys over 52,083 works, twice, is ~6M comparisons per render.
    const bucket = arr => {
      const m = new Map();
      for (const w of arr){ const k = decOf(w); let a = m.get(k); if (!a) m.set(k, a = []); a.push(w); }
      return m;
    };
    const setByDec = bucket(set), baseByDec = bucket(BASE);
    if (state.group === "decade" || state.artist !== null){
      const asc = state.decOrder === "earliest";
      let keys = [...new Set(set.map(decOf))].filter(k=>k!=="und").sort((a,b)=>asc?a-b:b-a);
      if (set.some(w=>w.y==null)) keys.push("und");
      const decSection = d => {
        let items = sortedGroup(d, setByDec.get(d) || [], !asc);
        if (d === "und" && state.sort === "year"){
          // Nothing here has a year, but not everything is equally unknown: 174 records
          // are dated to a century by the museum. Use that where it exists — it beats
          // the artist-lifetime proxy — and fall back to when the artist worked.
          const birth = i => +(A[i].l[0] || 9999);
          const centOf = w => {
            const m = w.yl && (w.yl.match(/(?:sajand:\s*)(\d{1,2})/i) || w.yl.match(/(\d{1,2})\s*\.?\s*saj/i));
            return m ? (+m[1] - 1) * 100 + 50 : null;   // mid-century, for ordering only
          };
          const at = w => centOf(w) ?? birth(w.a);
          items = items.slice().sort((x,y) => at(x)-at(y)
            || cmpStr(A[x.a].n, A[y.a].n) || cmpStr(x.t, y.t));
        }
        const yearBlock = (() => {
          if (d === "und"){
            const pool = baseByDec.get("und") || [];
            const byArtist = {};
            pool.forEach(w => { byArtist[w.a] = (byArtist[w.a]||0)+1; });
            const list = Object.entries(byArtist)
              .sort((x,y) => y[1]-x[1] || cmpStr(A[x[0]].n, A[y[0]].n)).slice(0, 14);
            const max = Math.max(1, ...list.map(x=>x[1]));
            return `<div class="gy gy-artists"><div class="gy-h">${esc(T("mostbyartist"))}</div>` +
              list.map(([i, n]) => `<button class="gy-row" data-artist="${i}" title="${esc(A[i].n)} · ${n===1?T('oneworkc'):T('nworks',{n})}">
                  <span class="gy-y">${esc(A[i].n.split(" ").length>1 ? A[i].n[0]+". "+surnameOf(A[i].n) : A[i].n)}</span>
                  <span class="gy-track"><span class="gy-bar" style="width:${Math.round((n/max)*100)}%"></span></span>
                  <span class="gy-n">${n}</span></button>`).join("") + `</div>`;
          }
          const pool = baseByDec.get(d) || [];
          const c = {}; for (let y=d; y<d+10; y++) c[y]=0;
          pool.forEach(w => { if (w.y!=null && c[w.y]!==undefined) c[w.y]++; });
          const max = Math.max(1, ...Object.values(c));
          return `<div class="gy"><div class="gy-h">${esc(state.year!==null?T("yearshowing",{y:state.year}):T("byyear"))}</div>` +
            Array.from({length:10}, (_, i) => {
              const y = d+i, n = c[y], on = state.year === y;
              if (!n) return `<div class="gy-row gy-empty"><span class="gy-y">${y}</span><span class="gy-track"></span><span class="gy-n">·</span></div>`;
              return `<button class="gy-row" data-gyear="${y}" aria-pressed="${on}" title="${n===1?T('oneworkc'):T('nworks',{n})} · ${y}">
                <span class="gy-y">${y}</span>
                <span class="gy-track"><span class="gy-bar" style="width:${Math.round((n/max)*100)}%"></span></span>
                <span class="gy-n">${n}</span></button>`;
            }).join("") + `</div>`;
        })();
        // A shortlist is a handful of works the reader chose; the decade's blurb and
        // year chart are about the catalogue, not their list. Just the decade.
        const slim = !!listKeys();
        const gutter = d==="und"
          ? `<span class="g-num" style="font-size:2rem">n.d.</span>
             <div class="g-period">${esc(T("undated"))}</div>${slim ? "" : `
             <p class="g-blurb">${esc(T("undatedblurb"))}</p>${yearBlock}`}`
          : `<span class="g-num">${d}<span style="font-size:.55em">s</span></span>
             <div class="g-period">${esc(periodLabel(d))}</div>${slim ? "" : `
             <p class="g-blurb">${esc(blurbFor(d))}</p>${yearBlock}`}`;
        return groupHTML(d, gutter, items, true);
      };
      // Untouched, the page listed every decade one after another: 57 groups, each with
      // its gutter and its first rows, 74,000px before anyone had asked for anything.
      // A broad view opens on a mosaic instead: one column per century, wide as its
      // share of the works; the decades stacked inside it, tall as theirs. The whole
      // span reads at a glance, and a decade opens beneath the mosaic on a click. A
      // narrow view (an artist, a single decade) is short enough to stay flat, and a
      // search always is: someone who typed a name wants the works, not a chart.
      const compact = state.artist === null && !state.q && keys.length > 6 && set.length > 300;
      if (!compact) html = keys.map(decSection).join("");
      else html = mosaicHTML(keys, k => (setByDec.get(k) || []).length)
               + keys.filter(d => state.od.has(String(d))).map(decSection).join("");
    } else {
      // The last word is not the surname when the name ends in a bracket -- "Johann
      // Willinges (1560-1625)" sorted under "(", ahead of every letter. surnameOf skips those.
      const surname = surnameOf;
      const birth = i => +(A[i].l[0]||9999);
      const idxs = [...new Set(set.map(w=>w.a))].sort((x,y)=>
        state.artOrder==="az" ? COLL.compare(surname(A[x].n), surname(A[y].n))
                              : (birth(x)-birth(y)) || COLL.compare(surname(A[x].n), surname(A[y].n)));
      const shownIdxs = idxs.slice(0, state.gLimit);
      html = shownIdxs.map(i => {
        const ar = A[i];
        const items = sortRows(set.filter(w=>w.a===i), false);
        const life = (ar.l[0]||ar.l[1]) ? `${ar.l[0]}–${ar.l[1]||""}` : "dates unrecorded";
        // In the museums-and-for-sale view the split is the point: how much of the
        // artist a public collection holds against how much is on the market.
        const split = state.cross ? (() => {
          const held = HELD_N.get(i) || 0, sold = items.length;
          return `<div class="g-split">${held.toLocaleString(LANG==="en"?"en":"et")} ${esc(T("cross_held"))} · ${sold} ${esc(T("cross_sold"))}</div>`; })() : "";
        const au = auLine(i);
        const gutter = `<span class="g-name">${esc(ar.n)}</span>
          <div class="g-dates">${esc(life)}${stag(ar.ls)}</div>${split}${au ? `<div class="g-split">${esc(au)}</div>` : ""}
          <p class="g-blurb">${esc(bioFor(ar).t)}</p>
          <button class="showartist" data-artist="${i}">Open artist →</button>`;
        return groupHTML("a"+i, gutter, items, false);
      }).join("");
      if (idxs.length > shownIdxs.length)
        html += `<button class="more" id="more-artists" style="margin-top:18px">${esc(T("moreartists",{n:fmt(idxs.length-shownIdxs.length)}))}</button>`;
    }
    reg.innerHTML = html;
  }
  // ---- auction results --------------------------------------------------------
  // The lots in the current selection, one group per sale, newest sale first, the
  // highest result at the top of each. Every filter applies: an artist's sales, a
  // medium's, a decade's. The row already states the outcome and links to the lot.
  function renderAuctions(set){
    const lots = set.filter(w => w.kind === "auction");
    if (!lots.length) return `<p class="empty">${esc(T("au_none"))}</p>`;
    const sales = new Map();
    for (const w of lots){
      const k = `${w.ad}|${w.mu}|${w.an}`;
      let g = sales.get(k); if (!g) sales.set(k, g = {ad: w.ad, mu: w.mu, an: w.an, items: []});
      g.items.push(w);
    }
    if (state.sort === "price"){
      // one list across every sale, highest hammer first; the sort's order toggle flips it
      const items = sortRows(lots, state.decOrder === "earliest"), sold = lots.filter(w => w.ao && w.ap);
      const ps = sold.map(w => w.ap).sort((a, b) => a - b);
      const gutter = `<span class="g-name">${esc(T("au_byprice"))}</span>
        <div class="g-split">${esc(T("au_saleline", {n: fmt(lots.length), s: fmt(lots.filter(w => w.ao).length)}))}${ps.length ? ` · ${fmt(ps[0])}–${eur(ps[ps.length-1])}` : ""}</div>`;
      return groupHTML("price", gutter, items, true) + `<p class="tl-note">${esc(T("au_note"))}</p>`;
    }
    const asc = state.decOrder === "earliest";
    const order = [...sales.values()].sort((x, y) => asc ? x.ad.localeCompare(y.ad) : y.ad.localeCompare(x.ad));
    const shown = order.slice(0, state.auLimit);
    return shown.map((g, k) => {
      const items = g.items.slice().sort((x, y) => (y.ap || -1) - (x.ap || -1) || cmpStr(A[x.a].n, A[y.a].n));
      const sold = items.filter(w => w.ao), total = sold.reduce((n, w) => n + (w.ap || 0), 0);
      const top = sold.length && sold[0].ap ? sold[0] : null;
      const when = g.ad.length > 7 ? g.ad.split("-").reverse().join(".") : (g.ad.slice(5, 7) ? `${g.ad.slice(5, 7)}.${g.ad.slice(0, 4)}` : g.ad);
      const gutter = `<span class="g-name">${esc(g.an)}</span>
        <div class="g-dates">${esc(musName(g.mu))} · ${esc(when)}</div>
        <div class="g-split">${esc(T("au_saleline", {n: fmt(items.length), s: fmt(sold.length)}))}${total ? ` · ${esc(T("au_total", {p: eur(total)}))}` : ""}</div>
        ${top ? `<p class="g-blurb">${esc(T("au_top"))}: ${esc(A[top.a].n)}, <em>${esc(top.t)}</em> — ${esc(eur(top.ap))}</p>` : ""}`;
      return groupHTML("s" + k, gutter, items, true);
    }).join("") + (order.length > shown.length
      ? `<button class="more" id="more-sales" style="margin-top:18px">${esc(T("au_moresales", {n: fmt(order.length - shown.length)}))}</button>` : "")
      + `<p class="tl-note">${esc(T("au_note"))}</p>`;
  }
  const AU_N = W.reduce((n, w) => n + (w.kind === "auction" ? 1 : 0), 0);
  const AU_HOUSES = new Set(W.filter(w => w.kind === "auction").map(w => w.mu)).size;

  // ---- timeline ---------------------------------------------------------------
  // One bar per artist with a known birth year, on one axis: birth to death, or to
  // now. A dark segment inside it marks the years the catalogue holds dated work
  // from. The decade chart counts works; this draws lives -- who overlapped with whom,
  // the generation whose Estonian holdings stop in 1944 while the bar carries on
  // abroad. Every filter applies, so "Trained at: Pallas" draws that generation alone.
  const SPAN = (() => {                    // first and last dated work per artist
    const m = new Map();
    for (const w of W){
      if (w.y == null || w.f) continue;    // a year outside the artist's life is not their activity
      const s = m.get(w.a);
      if (!s) m.set(w.a, [w.y, w.y]); else { if (w.y < s[0]) s[0] = w.y; if (w.y > s[1]) s[1] = w.y; }
    }
    return m;
  })();
  // the years an artist's work went to auction, for the timeline
  const SALES = (() => {
    const m = new Map();
    for (const w of W){ if (w.kind !== "auction" || !w.ao) continue; const y = +w.ad.slice(0, 4); let s = m.get(w.a); if (!s) m.set(w.a, s = new Map()); s.set(y, (s.get(y) || 0) + 1); }
    return m;
  })();
  let TL_ROWS = [];                        // the last drawn order, for the year ticks
  function renderTimeline(set){
    const NOW = new Date().getFullYear();
    const yr = s => { const m = /\d{4}/.exec(s || ""); return m ? +m[0] : null; };
    const everyone = [...new Set(set.map(w => w.a))];
    const rows = everyone.map(i => ({i, a: A[i], b: yr(A[i].l[0]), d: yr(A[i].l[1])})).filter(r => r.b);
    if (!rows.length) return `<p class="empty">${esc(T("tl_none"))}</p>`;
    rows.sort((x, y) => (state.decOrder === "latest" ? y.b - x.b : x.b - y.b) || COLL.compare(surnameOf(x.a.n), surnameOf(y.a.n)));
    TL_ROWS = rows;
    const lo = Math.floor(Math.min(...rows.map(r => r.b)) / 50) * 50, hi = NOW + 4;
    const frac = y => (y - lo) / (hi - lo);
    const pct = y => (frac(y) * 100).toFixed(2) + "%";
    const num = n => n.toLocaleString(LANG === "en" ? "en-GB" : "et-EE");
    const ticks = []; for (let y = lo; y <= NOW; y += 50) ticks.push(y);
    const axis = `<div class="tl-axis"><span class="tl-lab"></span><div class="tl-track">`
      + ticks.map(y => `<button class="tl-tick" data-year="${y}" style="left:${pct(y)}" title="${esc(T("tl_jump", {y}))}">${y}</button>`).join("") + `</div></div>`;
    const grid = ticks.map(y => `<span class="tl-grid" style="left:calc(var(--tl-lab) + (100% - var(--tl-lab)) * ${frac(y).toFixed(4)})"></span>`).join("");
    const shown = rows.slice(0, state.tlLimit);
    const body = shown.map(({i, a, b, d}) => {
      const end = d || NOW, sp = SPAN.get(i);
      const life = `<span class="tl-life${d ? "" : " living"}" style="left:${pct(b)};width:${((end - b) / (hi - lo) * 100).toFixed(2)}%"></span>`;
      const act = sp ? `<span class="tl-act" style="left:${pct(sp[0])};width:${Math.max(0.25, (sp[1] - sp[0]) / (hi - lo) * 100).toFixed(2)}%" title="${esc(T("tl_active", {a: sp[0], b: sp[1]}))}"></span>` : "";
      const sl = SALES.get(i);
      const marks = sl ? [...sl.entries()].map(([y, n]) => `<span class="tl-sale" style="left:${pct(y)}" title="${esc(T("tl_sale", {y, n}))}"></span>`).join("") : "";
      return `<div class="tl-row" data-b="${b}"><button class="tl-lab" data-tl="${i}" title="${esc(a.n)} · ${b}–${d || ""}">${esc(a.n)}<span class="tl-d">${b}–${d || ""}</span></button><div class="tl-track">${life}${act}${marks}</div></div>`;
    }).join("");
    const more = rows.length > shown.length
      ? `<button class="more" id="more-tl" style="margin-top:18px">${esc(T("moreartists", {n: num(rows.length - shown.length)}))}</button>` : "";
    return `<div class="tl">${grid}${axis}${body}</div>${more}`
      + `<p class="tl-note">${esc(T("tl_note", {n: num(rows.length), u: num(everyone.length - rows.length)}))}</p>`;
  }
  reg.addEventListener("click", e => {
    const b = e.target.closest("[data-tl]");
    if (b){ setGroup("artist"); selectArtist(+b.dataset.tl); return; }
    if (e.target.closest("#more-tl")){ state.tlLimit += 400; render(); return; }
    const t = e.target.closest(".tl-tick");
    if (t){
      // Jump to the first artist born in or after that year (or before, when the
      // order is reversed). Rows past the four-hundred window are not drawn yet, so
      // widen the window to reach the target before scrolling to it.
      const y = +t.dataset.year, latest = state.decOrder === "latest";
      let k = TL_ROWS.findIndex(r => latest ? r.b <= y : r.b >= y);
      if (k < 0) k = TL_ROWS.length - 1;
      if (k >= state.tlLimit){ state.tlLimit = Math.ceil((k + 1) / 400) * 400; render(); }
      const row = reg.querySelectorAll(".tl-row")[k];
      if (row){
        const top = row.getBoundingClientRect().top + scrollY - $("register").querySelector(".tl-axis").offsetHeight
                  - document.querySelector(".controls").offsetHeight - 8;
        window.scrollTo({top, behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth"});
      }
    }
  });

  // ---- landing doors --------------------------------------------------------
  // The register opened grouped by decade, earliest first, so the first thing a
  // visitor met was the 1440s: one object, by nobody they have heard of. No decade
  // makes a good first row -- without images a single catalogue line cannot carry a
  // landing view -- so the question is not which row comes first but what the first
  // screen is. One door above the list: a name -- the way in people actually arrive
  // with. A period door and a collection door were here too; the eras now sit under
  // the histogram against the bars they describe, and the museum facet does
  // collections. Any search or filter hides it.
  // Sixteen names, chosen rather than counted. Ranked by holdings, the door read as a
  // list of the most prolific -- Richard Sagrits above Konrad Mägi, Gori above Köler --
  // which is a fact about museum acquisition, not about Estonian art. These are the
  // artists a history of it cannot leave out, one sculptor among them, in order of
  // birth. Editorial: the one place on the page where a judgement stands in for a count,
  // and tagged as such like every other editorial line.
  const CANON = ["Johann Köler", "Amandus Adamson", "Kristjan Raud", "Ants Laikmaa",
                 "Konrad Mägi", "Nikolai Triik", "Eduard Wiiralt", "Karin Luts",
                 "Evald Okas", "Ülo Sooster", "Olev Subbi", "Jüri Arrak",
                 "Malle Leis", "Raul Meel", "Tõnis Vint", "Leonhard Lapin"];
  // Artists a public collection has accessioned AND a gallery is selling right now.
  // The most interesting slice for a collector, and invisible until here: it needs
  // two facets at once, which the facet panel cannot express.
  const CROSS = (() => {
    const held = new Set(), sold = new Set();
    W.forEach(w => { if (w.kind === "gallery") sold.add(w.a); else if (isHeld(w)) held.add(w.a); });
    return new Set([...held].filter(i => sold.has(i)));
  })();
  const HELD_N = (() => { const m = new Map(); W.forEach(w => { if (isHeld(w)) m.set(w.a, (m.get(w.a) || 0) + 1); }); return m; })();
  const FOR_SALE = W.reduce((n, w) => n + (w.kind === "gallery" ? 1 : 0), 0);
  const CROSS_WORKS = W.reduce((n, w) => n + (w.kind === "gallery" && CROSS.has(w.a) ? 1 : 0), 0);
  const TOP_ART = (() => {
    const c = new Map(); W.forEach(w => c.set(w.a, (c.get(w.a) || 0) + 1));
    const byName = new Map(A.map((a, i) => [a.n, i]));
    const missing = CANON.filter(n => !byName.has(n));
    if (missing.length) console.warn("canon names not in this build:", missing);
    return CANON.filter(n => byName.has(n)).map(n => [byName.get(n), c.get(byName.get(n)) || 0]);
  })();
  // The app already names Estonia's periods for the decade bands. The doors reuse
  // exactly those labels rather than inventing a parallel vocabulary, plus one band
  // for everything earlier than the first of them.
  const DOOR_PERIODS = [[null, 1699, null], ...PERIODS.map(p => [p[0], p[1], p[2]])];
  const dpLabel = ([, , key]) => key === null ? T("p_pre")
    : (LANG === "en" ? I18N.PERIOD_EN[key] : I18N.PERIOD_ET[key]);
  const PCOUNT = DOOR_PERIODS.map(([lo, hi]) => W.reduce((n, w) =>
    n + (w.y != null && (lo === null || w.y >= lo) && w.y <= hi ? 1 : 0), 0));

  const pristine = () => !state.q && !listKeys() && !state.cross && !state.sale && state.decade === null && state.artist === null
    && state.letter === null && state.from === null && state.to === null && state.year === null
    && !state.undOnly && !state.media.size && !state.museums.size && !state.cats.size
    && !state.srcs.size && !state.origins.size && !state.groups.size;

  function renderDoors(){
    const el = $("doors");
    if (!pristine()){ el.hidden = true; el.innerHTML = ""; return; }
    const num = n => n.toLocaleString(LANG === "en" ? "en-GB" : "et-EE");
    const col = (head, items, cls, tag) => `<div class="${cls || ""}"><h2>${esc(T(head))}${tag ? ` <span class="tag">${esc(tag)}</span>` : ""}</h2><ul>` + items.map(
      ([label, n, kind, v]) => `<li><button data-door="${kind}" data-v="${v}">` +
        `<span>${esc(label)}</span><span class="n">${num(n)}</span></button></li>`).join("") + "</ul></div>";
    el.innerHTML =
      col("doors_name",   TOP_ART.map(([i, n]) => [A[i].n, n, "a", i]), "d-names", "ed")
      + `<p class="door-line"><button data-door="x" data-v="0">${esc(T("doors_cross"))}<span class="n">${num(CROSS_WORKS)} ${esc(T("of_n", {n: num(FOR_SALE)}))} ${esc(T("forsale"))} · ${num(CROSS.size)} ${esc(T("artists"))}</span><span class="arrow">&rarr;</span></button></p>`
      + (AU_N ? `<p class="door-line"><button data-door="q" data-v="0">${esc(T("doors_auctions"))}<span class="n">${num(AU_N)} ${esc(T("au_lots"))} · ${AU_HOUSES} ${esc(T("au_houses"))}</span><span class="arrow">&rarr;</span></button></p>` : "");
    el.hidden = false;
  }

  // ---- shortlist ------------------------------------------------------------
  // A visitor's own list of works, kept in this browser. Every visit used to start
  // from nothing: a researcher assembling references, or a collector comparing what
  // is on the market, had nowhere to put a record they meant to come back to. The
  // list lives in localStorage -- no account, no server; nothing leaves the machine
  // unless they export it or share a link, and the link carries the keys and nothing
  // else. Keys are inventory numbers, so a list survives rebuilds of the catalogue.
  const SL_KEY = "museaal.shortlist";
  const KEYSET = new Set(W.map(w => w.k));
  const SL = new Set((() => { try { return JSON.parse(localStorage.getItem(SL_KEY) || "[]"); } catch(e){ return []; } })()
                     .filter(k => typeof k === "string"));
  const slSave = () => { try { localStorage.setItem(SL_KEY, JSON.stringify([...SL])); } catch(e){} };
  // What the register is restricted to: your list, a list someone shared, or nothing.
  const listKeys = () => state.shared || (state.list ? SL : null);
  // Detail fields (dimensions, source ids) live in a shard in the sharded build and on
  // the record itself in the single-file one; read them the same way in both.
  const det = w => (typeof detailOf === "function" ? (detailOf(w) || {}) : w);
  const SL_ICON = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2h8v12l-4-3-4 3z"/></svg>';
  const slBtn = (k, cls) => {
    const on = SL.has(k), lab = T(on ? "sl_remove" : "sl_add");
    return `<button class="sl${cls ? " " + cls : ""}" data-sl="${esc(k)}" aria-pressed="${on}" title="${esc(lab)}" aria-label="${esc(lab)}">`
         + SL_ICON + (cls ? `<span>${esc(lab)}</span>` : "") + `</button>`;
  };
  function slToggle(k){
    if (SL.has(k)) SL.delete(k); else SL.add(k);
    slSave();
    if (listKeys()){ render(); pushHash(true); return; }   // the row leaves or joins the view
    // Otherwise touch only what changed: a full render is the expensive part of this page.
    document.querySelectorAll(`.sl[data-sl="${CSS.escape(k)}"]`).forEach(b => {
      const on = SL.has(k), lab = T(on ? "sl_remove" : "sl_add");
      b.setAttribute("aria-pressed", on); b.title = lab; b.setAttribute("aria-label", lab);
      const t = b.querySelector("span"); if (t) t.textContent = lab;
    });
    renderListBar();
  }
  function renderListBar(){
    const el = $("listbar"), keys = listKeys();
    $("mylist").textContent = SL.size ? T("mylist_n", {n: SL.size}) : T("mylist");
    $("mylist").setAttribute("aria-pressed", !!state.list);
    if (!keys){ el.hidden = true; el.innerHTML = ""; return; }
    const n = [...keys].filter(k => KEYSET.has(k)).length;
    const count = state.shared ? T("sl_shared", {n}) : (n === 1 ? T("sl_one") : T("sl_count", {n}));
    el.innerHTML = `<b>${esc(count)}</b>`
      + (state.shared ? `<button class="linkbtn" data-sl-act="adopt">${esc(T("sl_adopt"))}</button>` : "")
      + (n ? `<button class="linkbtn" data-sl-act="csv">${esc(T("sl_csv"))}</button>`
           + `<button class="linkbtn" data-sl-act="link">${esc(T("sl_link"))}</button>` : "")
      + (!state.shared && n ? `<button class="linkbtn" data-sl-act="clear">${esc(T("sl_clear"))}</button>` : "")
      + `<button class="linkbtn" data-sl-act="close">${esc(T("sl_close"))}</button>`
      + `<span class="sl-note">${esc(T(n ? (state.shared ? "sl_shared_note" : "sl_kept") : "sl_empty"))}</span>`;
    el.hidden = false;
  }
  async function slCSV(){
    const keys = listKeys() || SL;
    const rows = W.filter(w => keys.has(w.k));
    if (typeof loadShard === "function")   // dimensions and source ids are in the shards
      await Promise.all([...new Set(rows.filter(w => w.h && !detailOf(w)).map(shardOf))].map(loadShard));
    const src = w => { const d = det(w);
      return d.mi ? `https://www.muis.ee/museaalview/${d.mi}`
           : d.oi ? `https://digikogu.ekm.ee/ekm/search/oid-${d.oi}/` : (d.url || ""); };
    const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const head = ["artist", "title", "year", "technique", "medium", "dimensions", "holder", "inventory_no", "kind", "source"];
    const lines = [head.join(",")].concat(rows.map(w => [
      A[w.a].n, w.t, w.y ?? "", techName(w) || "", medName(w.e) || "", det(w).dm || "",
      musName(w.mu), w.nu || "", w.kind || "held", src(w)].map(q).join(",")));
    const blob = new Blob(["\ufeff" + lines.join("\r\n")], {type: "text/csv;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "museaal-list.csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  const slShareURL = () => location.origin + location.pathname + "#list="
    + [...(listKeys() || SL)].filter(k => KEYSET.has(k)).join(",");
  async function slCopyLink(btn){
    const url = slShareURL(), was = btn.textContent;
    try { await navigator.clipboard.writeText(url); btn.textContent = T("copied"); }
    catch(e){ prompt(T("sl_link"), url); return; }   // clipboard refused: let them copy by hand
    setTimeout(() => { btn.textContent = was; }, 2200);
  }

  const renderAll = () => { renderBars(); renderYearRange(); renderFacets(); renderActiveFilters(); renderArtistIndex(); renderMono(); render(); };

  function selectArtist(i){
    state.artist = i; state.open = null; state.expand.clear();
    state.decade = null; state.idxOpen = false; state.letter = null;
    renderAll(); pushHash();
    window.scrollTo({top: 0, behavior: matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});
  }
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-artist]");
    if (b){ e.preventDefault(); selectArtist(+b.dataset.artist); }
  });
  $("ai-toggle").addEventListener("click", () => {
    state.idxOpen = !state.idxOpen; state.idxLimit = 120; renderArtistIndex(); pushHash(true);
  });
  $("ai-body").addEventListener("click", e => {
    if (e.target.closest("#more-index")){ state.idxLimit += 300; renderArtistIndex(); }
  });

  // ---- suggestions under the search box -------------------------------------------
  // Typing a name or a title should get you to the thing, not to a filtered list of
  // everything containing the letters. Artists whose name has a word starting with
  // what was typed, then works whose title does; an artist opens their view, a work
  // opens its record in the artist's view.
  const AKEY = A.map(a => skey(a.n));
  const ACOUNT = (() => { const c = new Array(A.length).fill(0); W.forEach(w => c[w.a]++); return c; })();
  const sugg = $("sugg"), qbox = $("q");
  let sgItems = [], sgSel = -1;
  const starts = (key, q) => key.startsWith(q) || key.includes(" " + q) || key.includes("-" + q);
  const hi = (text, q) => {                       // the typed part in bold, on a word boundary
    const k = skey(text); let i = k.startsWith(q) ? 0 : -1;
    if (i < 0){ const j = k.indexOf(" " + q); if (j >= 0) i = j + 1; }
    if (i < 0){ const j = k.indexOf("-" + q); if (j >= 0) i = j + 1; }
    return i < 0 ? esc(text) : esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + esc(text.slice(i + q.length));
  };
  function suggest(raw){
    const q = skey(raw.trim());
    sgItems = []; sgSel = -1;
    if (q.length < 2){ sugg.hidden = true; sugg.innerHTML = ""; qbox.setAttribute("aria-expanded", "false"); return; }
    const arts = [];
    for (let i = 0; i < A.length && arts.length < 40; i++) if (ACOUNT[i] && starts(AKEY[i], q)) arts.push(i);
    arts.sort((x, y) => (AKEY[y].startsWith(q) - AKEY[x].startsWith(q)) || ACOUNT[y] - ACOUNT[x] || cmpStr(A[x].n, A[y].n));
    const works = [];
    for (let i = 0; i < W.length && works.length < 60; i++){ const w = W[i]; if (starts(SK(w), q)) works.push(w); }
    works.sort((x, y) => (SK(y).startsWith(q) - SK(x).startsWith(q)) || (x.y || 9999) - (y.y || 9999) || cmpStr(x.t, y.t));
    const top = arts.slice(0, 5), tw = works.slice(0, 6);
    if (!top.length && !tw.length){ sugg.hidden = true; sugg.innerHTML = ""; qbox.setAttribute("aria-expanded", "false"); return; }
    let html = "";
    if (top.length){
      html += `<div class="sg-h">${esc(T("sg_artists"))}</div>` + top.map(i => { const n = sgItems.push({a: i}) - 1;
        const life = (A[i].l[0] || A[i].l[1]) ? `${A[i].l[0]}–${A[i].l[1] || ""}` : "";
        return `<button role="option" data-sg="${n}" id="sg-${n}"><span class="sg-t">${hi(A[i].n, q)}</span><span class="sg-m">${esc(life)}${life ? " · " : ""}${fmt(ACOUNT[i])} ${esc(T("works"))}</span></button>`; }).join("");
    }
    if (tw.length){
      html += `<div class="sg-h">${esc(T("sg_works"))}</div>` + tw.map(w => { const n = sgItems.push({w}) - 1;
        return `<button role="option" data-sg="${n}" id="sg-${n}"><span class="sg-t"><em>${hi(w.t, q)}</em> · ${esc(A[w.a].n)}</span><span class="sg-m">${w.y || ""}${w.y ? " · " : ""}${esc(abbr(w.mu))}</span></button>`; }).join("");
    }
    sugg.innerHTML = html; sugg.hidden = false; qbox.setAttribute("aria-expanded", "true");
  }
  function sgGo(n){
    const it = sgItems[n]; if (!it) return;
    clearTimeout(t);
    sugg.hidden = true; sugg.innerHTML = ""; qbox.setAttribute("aria-expanded", "false");
    state.q = ""; qbox.value = "";
    if (it.a !== undefined){ setGroup("decade"); selectArtist(it.a); return; }

    state.artist = it.w.a; state.decade = null; state.idxOpen = false; state.letter = null;

  const sgMove = d => {

  // Inside a Claude artifact the page runs on <artifact-id>.<something>.claudeusercontent.com,
  // and that address carries single-use frame tokens that are useless (and unwise) to share.
  // The artifact id is the first hostname label, so rebuild the public link from it.
  const BUILD = "2026-09-09d";
  function frameId(host){
    if (!/\.claudeusercontent\.com$/i.test(host || "")) return null;
    const first = String(host).split(".")[0];
    return /^[0-9a-f]{8}-[0-9a-f-]{20,}$/i.test(first) ? first : null;
  }
  function shareURL(loc, hash){
    loc = loc || location;
    const h = hash === undefined ? stateToHash() : hash;
    const frag = h ? "#" + h : "";
    const id = frameId(loc.hostname);
    if (id) return { url: "https://claude.ai/code/artifact/" + id + frag, rewritten: true, ok: true };
    const base = String(loc.href || "").split("#")[0];
    const embeddedButUnknown = EMBEDDED && /claudeusercontent|\/_f\//i.test(base);
    return { url: base + frag, rewritten: false, ok: !embeddedButUnknown };
  }
  window.__shareURL = shareURL;
  window.__build = BUILD;

    $("sharenote").innerHTML = (
      r.rewritten
        ? `<b>Public link to this artifact.</b> Tested: Claude's viewer does <b>not</b> reopen on the view after the <b>#</b> — it runs this page in a sandbox that never receives that part of the address, so the link above opens the register at the top. It is still the right link to send. To get back to <i>this</i> view: press Back, or reload and use <b>Restore last view</b>. Deep links work in full only in the standalone file.`
        : !r.ok
          ? `<b>Could not rebuild a public link.</b> This page is embedded and its address carries sandbox tokens, so the link above is not safe to share. Use <b>Restore last view</b>, or open the standalone file, where the address bar carries the view directly.`
          : EMBEDDED
            ? `<b>This page is embedded.</b> Copy the address above rather than the browser's address bar, which may show the container instead.`
            : `<b>Address bar carries this view.</b> Copy it, bookmark it, or press Back to step through what you clicked.`
    ) + stamp;
  }

    $("srcsplit").textContent = LANG === "en"
      ? `${DATA.meta.dated_from_title} works carry a date the cataloguer wrote at the end of the title rather than in the dating field; those are marked with an asterisk. ${DATA.meta.objects.toLocaleString(LANG === "en" ? "en-GB" : "et-EE")} catalogued objects → ${DATA.meta.works.toLocaleString(LANG === "en" ? "en-GB" : "et-EE")} works (identical title + date + artist collapsed): ${DATA.meta.muis.toLocaleString(LANG === "en" ? "en-GB" : "et-EE")} from MuIS, ${DATA.meta.ekm.toLocaleString(LANG === "en" ? "en-GB" : "et-EE")} from the EKM Digital Collection, ${DATA.meta.both.toLocaleString(LANG === "en" ? "en-GB" : "et-EE")} in both, merged on inventory number. A further ${DATA.meta.gallery.toLocaleString(LANG === "en" ? "en-GB" : "et-EE")} works are the current stock of ${DATA.meta.galleries} galleries, from their own catalogues.${DATA.meta.past ? ` ${fmt(DATA.meta.past)} are past listings — works a gallery has sold (${fmt(DATA.meta.past_sold)}) or no longer lists — kept as a record of the work, never as stock.` : ""}${DATA.meta.auction ? ` ${fmt(DATA.meta.auction)} auction lots (${fmt(DATA.meta.auction_sold)} sold) are results as Haus Galerii, Vernissage, Allee galerii, Vaal galerii and Eesti Kunsti Oksjonid published them.` : ""}`
      : `${DATA.meta.dated_from_title} teosel on dateering kirjutatud pealkirja lõppu, mitte dateeringuvälja; need on tähistatud tärniga. ${DATA.meta.objects.toLocaleString("et")} museaali → ${DATA.meta.works.toLocaleString("et")} teost (sama pealkiri + dateering + autor koondatud): ${DATA.meta.muis.toLocaleString("et")} MuIS-ist, ${DATA.meta.ekm.toLocaleString("et")} EKM Digitaalkogust, ${DATA.meta.both.toLocaleString("et")} mõlemast, ühendatud tulmenumbri järgi. Veel ${DATA.meta.gallery.toLocaleString("et")} teost on ${DATA.meta.galleries} galerii praegune müügivalik, nende endi kataloogidest.${DATA.meta.past ? ` ${fmt(DATA.meta.past)} on varasemad müügipakkumised — teosed, mille galerii on müünud (${fmt(DATA.meta.past_sold)}) või mida ta enam ei paku — jäetud teose kirjena, mitte kunagi laoseisuna.` : ""}${DATA.meta.auction ? ` ${fmt(DATA.meta.auction)} oksjonipartiid (${fmt(DATA.meta.auction_sold)} müüdud) on tulemused nii, nagu Haus Galerii, Vernissage, Allee galerii, Vaal galerii ja Eesti Kunsti Oksjonid need avaldasid.` : ""}`;
    const un = $("undated-note");
    if (un) un.textContent = LANG === "en"
      ? `${DATA.meta.undated} of ${DATA.meta.works.toLocaleString(LANG === "en" ? "en-GB" : "et-EE")} records carry no dating; they sit in their own group rather than being guessed into a decade.`
      : `${DATA.meta.undated} kirjet ${DATA.meta.works.toLocaleString("et")}-st on dateerimata; need on omaette rühmas, mitte kümnendisse ära arvatud.`;
    fillYearSelects();
    renderYearRange();
    syncOrder();
  }
  function setLang(l, push){
    LANG = (l === "en") ? "en" : "et";
    try { localStorage.setItem("ekr:lang", LANG); } catch(e){}
    AI = null;
    applyLang(); renderAll();
    if (push !== false) pushHash(true);
  }
  $("lang-et").addEventListener("click", () => setLang("et"));
  $("th-auto").addEventListener("click", () => setTheme("auto"));
  $("th-light").addEventListener("click", () => setTheme("light"));
  $("th-dark").addEventListener("click", () => setTheme("dark"));
  $("lang-en").addEventListener("click", () => setLang("en"));

  function applyURL(scroll){
    applying = true;
    fillYearSelects();
    hashToState();
    applyLang();
    $("q").value = state.q;
    $("sortby").value = state.sort;
    renderYearRange();
    setGroup(state.group);
    renderAll();
    applying = false;
    if (scroll && state.open){
      const el = document.querySelector(`.row-btn[data-id="${CSS.escape(state.open)}"]`);
      if (el) el.scrollIntoView({behavior:"auto", block:"center"});
    }
  }
  // ---------- keyboard navigation ----------
  const isTyping = el => !!el && (/^(input|textarea|select)$/i.test(el.tagName) || el.isContentEditable);
  // Keyboard navigation removed. Two conventions are kept because they are invisible
  // and cost nothing: "/" jumps to the search box, Escape backs out of an open record
  // and then clears the search.
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (isTyping(document.activeElement)){
      if (e.key === "Escape") document.activeElement.blur();
      return;
    }
    if (e.key === "/"){ e.preventDefault(); $("q").focus(); $("q").select(); }
    else if (e.key === "Escape"){
      if (state.open){ state.open = null; render(); pushHash(); }
      else if (state.q){ state.q = ""; $("q").value = ""; renderAll(); pushHash(); }
    }
  });

  try { const saved = localStorage.getItem("ekr:lang"); if (saved === "en" || saved === "et") LANG = saved; } catch(e){}
  try { const st = localStorage.getItem("ekr:theme"); if (st === "light" || st === "dark") THEME = st; } catch(e){}
  window.addEventListener("popstate", () => applyURL(false));
  applyURL(true);

  if (!location.hash.replace(/^#/, "") && loadLast()){
    const last = loadLast();
    const b = document.createElement("button");
    b.className = "restore";
    b.textContent = T("restore");
    b.title = "#" + last;
    b.addEventListener("click", () => {
      try { history.replaceState(null, "", location.pathname + location.search + "#" + last); }
      catch(e){ location.hash = last; }
      applyURL(true); b.remove();
    });
    $("countline").before(b);
  }


})();
</script>
