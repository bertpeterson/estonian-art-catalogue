<script>
(function(){
  "use strict";
  // repeated strings ship once in DATA.vocab and are referenced by index; rehydrate them
  (function decode(){
    const V = DATA.vocab; if (!V) return;
    for (const f of Object.keys(V)){
      const table = V[f];
      for (const w of DATA.works){
        const i = w[f];
        if (typeof i === "number") w[f] = table[i];
      }
    }
    delete DATA.vocab;
    // row keys are the inventory number stripped of punctuation; only synthetic ones ship
    for (const w of DATA.works)
      if (!w.k) w.k = (w.nu || "").toUpperCase().replace(/[^A-Z0-9:]/g, "") || null;
  })();
  let LANG = "en";
  // the host may stamp data-theme itself; remember it so "auto" can hand control back
  const HOST_THEME = document.documentElement.getAttribute("data-theme");
  let THEME = "auto";
  function applyTheme(){
    const root = document.documentElement;
    if (THEME === "auto"){
      if (HOST_THEME) root.setAttribute("data-theme", HOST_THEME);
      else root.removeAttribute("data-theme");
    } else root.setAttribute("data-theme", THEME);
    for (const t of ["auto","light","dark"])
      $("th-"+t).setAttribute("aria-pressed", THEME === t);
  }
  function setTheme(t, push){
    THEME = ["light","dark"].includes(t) ? t : "auto";
    try { localStorage.setItem("ekr:theme", THEME); } catch(e){}
    applyTheme();
    if (push !== false) pushHash(true);
  }
  const T = (k, v) => {
    let s = (I18N[LANG === "en" ? "EN" : "ET"][k]) ?? k;
    if (v) for (const p in v) s = s.split("{"+p+"}").join(v[p]);
    return s;
  };
  // "21st", not "21th" — and Estonian just wants the ordinal dot
  const ordN = n => LANG !== "en" ? n + "."
    : n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : (["th","st","nd","rd"][n % 10] || "th"));
  const musName = m => LANG === "en" ? (I18N.MUSEUM_EN[m] || m) : m;
  // One rule for every count on the page: 51,793 in English, 51 793 in Estonian.
  const fmt = n => (+n).toLocaleString(LANG === "en" ? "en-GB" : "et-EE");
  // Each holder's own website, verified when data/venues.json was compiled. A record
  // should be able to send you to the place that holds the work.
  const SITES = (DATA.meta && DATA.meta.sites) || {};
  const siteOf = m => SITES[m] || null;
  const bioFor = ar => {
    const en = ar.ben, et = ar.b;
    if (LANG === "en") return en ? {t:en, s:ar.bens, alt:false, mt:!!ar.bmt} : (et ? {t:et, s:ar.bs, alt:true} : {t:"", s:null, alt:false});
    return et ? {t:et, s:ar.bs, alt:false} : (en ? {t:en, s:ar.bens, alt:true, mt:!!ar.bmt} : {t:"", s:null, alt:false});
  };
  const mtTag = () => `<span class="tag" title="${esc(T("mt_note"))}">${esc(T("translated"))}</span>`;
  const catName = c => LANG === "en" ? (I18N.CAT_EN[c] || c) : c;
  const medName = e => LANG === "en" ? e : (I18N.MEDIUM_ET[e] || e);
  const techName = w => LANG === "en" ? (w.tc || w.tce) : (w.tce || w.tc);
  const matName  = w => LANG === "en" ? (w.m  || w.me)  : (w.me  || w.m);
  function dateLabel(w){
    if (!w.yl) return "";
    if (LANG !== "en") return w.yl;
    let s = w.yl;
    for (const k in I18N.DATEWORD_EN) s = s.split(k).join(I18N.DATEWORD_EN[k]);
    return s.replace(/(\d{4})\.\s*s\b/g, "$1s").replace(/\s{2,}/g," ").trim();
  }
  const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const A = DATA.artists, W = DATA.works;
  const decOf = w => w.y == null ? "und" : Math.floor(w.y/10)*10;

  const MUS = {
    "Eesti Kunstimuuseum":"EKM","Tartu Kunstimuuseum":"TKM","Eesti Ajaloomuuseum":"AM",
    "Eesti Kunstiakadeemia muuseum":"EKA","Eesti Arhitektuurimuuseum":"EAM",
    "Tartu Ülikooli kunstimuuseum":"TÜKM","Dr. Fr. R. Kreutzwaldi Memoriaalmuuseum":"KRM",
    "Eesti Spordi- ja Olümpiamuuseum":"ESOM","Tallinna Linnamuuseum":"TLM",
    "Narva Muuseum":"NLM","Eesti Rahva Muuseum":"ERM","Uue Kunsti Muuseum":"UKM",
    "Eesti Teatri- ja Muusikamuuseum":"TMM","Viljandi Muuseum":"VM",
    "Eesti Kaasaegse Kunsti Muuseum":"EKKM","Veneetsia biennaal, Eesti paviljon":"VEN","Saaremaa Muuseum":"SM","Virumaa Muuseumid":"VIRU",
    "Eesti Maaelumuuseumid SA, Eesti Põllumajandusmuuseum":"EPM",
    "Eesti Maaelumuuseumid SA, C. R. Jakobsoni Talumuuseum":"JAK",
    "Hiiumaa Muuseumid":"HIIU","Haapsalu ja Läänemaa Muuseumid":"HLM","Pärnu Muuseum":"PM",
    // the auction houses, on the row beside their lots
    "Haus Galerii":"HAUS","Vernissage":"VERN","Allee galerii":"ALLEE","Vaal galerii":"VAAL","Eesti Kunsti Oksjonid":"EKO"};
  const abbr = m => MUS[m] || (m||"").slice(0,4).toUpperCase();

  // The state's own periodisation: independence declared 1918, lost to occupation in
  // June 1940 (Soviet 1940-41, German 1941-44, Soviet 1944-91), restored 20 August 1991.
  // A work dated 1940 or 1991 falls on the side history put it: 1940 with the
  // occupation, 1991 with the restored republic.
  const PERIODS = [[1700,1917,"Tsaariaeg","Imperial Russia"],[1918,1939,"Vabariik","First Republic"],
                   [1940,1990,"Okupatsioon","Occupation"],[1991,2099,"Taasiseseisvus","Restored Republic"]];
  const PERIOD_NOTE = {Okupatsioon: {et: "Nõukogude okupatsioon 1940–41 ja 1944–91, Saksa okupatsioon 1941–44", en: "Soviet occupation 1940–41 and 1944–91; German occupation 1941–44"},
                       Vabariik: {et: "Iseseisvus välja kuulutatud 24. veebruaril 1918", en: "Independence declared 24 February 1918"},
                       Taasiseseisvus: {et: "Iseseisvus taastatud 20. augustil 1991", en: "Independence restored 20 August 1991"}};
  const periodLabel = d => PERIODS.filter(p=>p[1]>=d && p[0]<=d+9)
    .map(p => LANG === "en" ? I18N.PERIOD_EN[p[2]] : I18N.PERIOD_ET[p[2]]).join("  →  ");
  const blurbFor = d => LANG === "en" ? (BLURBS[d] || "") : (I18N.BLURB_ET[d] || BLURBS[d] || "");

  const BLURBS = {
    1840:"Julie Hagen-Schwarz trains in Dresden and Italy — the first professionally schooled woman artist from Estonia.",
    1850:"Art here is still Baltic-German and academic. In 1855 Johann Köler, a peasant's son, enters the St Petersburg Academy.",
    1860:"The Awakening begins. Köler paints Estonians as subjects worth painting, and runs the movement's politics from the imperial capital.",
    1870:"Köler and Weizenberg work in St Petersburg and Rome. The first professional Estonian art is made abroad, for a nation with no state.",
    1880:"Weizenberg cuts Linda, mother of Kalevipoeg, in marble: the national epic enters academic sculpture.",
    1890:"Düsseldorf and Munich displace St Petersburg as the training ground. The Awakening generation reaches maturity.",
    1900:"Noor-Eesti sets the terms — “let us be Estonians, but let us also become Europeans” (Gustav Suits). Paris, and the 1905 revolution.",
    1910:"Konrad Mägi's colour and Ado Vabbe's line arrive together. The Republic is declared in 1918, in the middle of a war.",
    1920:"The Pallas school opens in Tartu in 1919; the Group of Estonian Artists brings constructivism back from Paris and Riga.",
    1930:"Wiiralt engraves Paris from the inside. At home, a state-sponsored national classicism.",
    1940:"Occupation, war, the 1941 and 1949 deportations, flight to Sweden. The generation splits between exile and the camps.",
    1950:"Socialist realism is compulsory. Abstraction survives privately in Tartu studios and in Sooster's prison notebooks.",
    1960:"The Thaw. ANK'64 in Tallinn, op art, surrealism, and the first exhibitions that are not about labour.",
    1970:"SOUP'69 and geometric abstraction. Lapin, Vint and Runge treat print, design and architecture as a single practice.",
    1980:"Stagnation and hyperrealism above ground; performance and installation in private courtyards.",
    1990:"Independence, the Soros Centre, and video. Estonian art joins the international circuit almost overnight.",
    2000:"Venice becomes the measure. A generation works between Tallinn, Berlin and Amsterdam.",
    2010:"Post-internet and the archive. e-Estonia turns into subject matter.",
    2020:"Ceramics, ecology and myth; Karlson's wolves fill a deconsecrated Venetian church."
  };

  // Surname for filing: drop bracketed aliases and any token that is pure punctuation,
  // so "F. K(nöttner)?" files under K rather than under "?".
  const surnameOf = n => {
    const t = n.replace(/\([^)]*\)?/g, " ").replace(/[()]/g, " ")
               .split(/\s+/).filter(x => /[\p{L}\p{N}]/u.test(x));
    return t.length ? t[t.length - 1] : n.trim();
  };
  const DECPOS = {};
  let DECC = null;
  function decTable(){
    if (DECC) return DECC;
    DECADES.forEach((d,i) => DECPOS[d] = i);
    DECC = A.map(() => DECADES.map(() => 0));
    for (const w of W){
      if (w.y == null || w.f) continue;     // a year outside the artist's life is not their activity
      const p = DECPOS[Math.floor(w.y/10)*10];
      if (p !== undefined) DECC[w.a][p]++;
    }
    return DECC;
  }
  const decCounts = idx => decTable()[idx];
  function spark(counts, w, h){
    const max = Math.max(1, ...counts), bw = w/counts.length;
    const bars = counts.map((c,i)=>{
      if (!c) return "";
      const bh = Math.max(1.5, (c/max)*h);
      return `<rect x="${(i*bw).toFixed(2)}" y="${(h-bh).toFixed(2)}" width="${Math.max(0.9,bw-0.9).toFixed(2)}" height="${bh.toFixed(2)}"/>`;
    }).join("");
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" preserveAspectRatio="none" aria-hidden="true" fill="currentColor">${bars}</svg>`;
  }

  // span whatever the data actually covers, rather than a range assumed up front
  const DECADES = (() => {
    const ys = W.map(w=>w.y).filter(y=>y!=null);
    const lo = Math.floor(Math.min(...ys)/10)*10, hi = Math.floor(Math.max(...ys)/10)*10;
    const out = []; for (let d=lo; d<=hi; d+=10) out.push(d);
    return out;
  })();

  // Facet vocabularies ordered by how many works carry each value. These used to count
  // through all 57,000 works inside the sort comparator -- twice per comparison -- which
  // was a third of a second at every page load. One pass each now.
  const bySize = f => {
    const n = new Map(); for (const w of W){ const v = w[f]; if (v != null) n.set(v, (n.get(v) || 0) + 1); }
    return [...n.keys()].sort((a, b) => n.get(b) - n.get(a));
  };
  const MEDIA = bySize("e"), MUSEUMS = bySize("mu"), CATS = bySize("c");
  const SRCS = [["muis","MuIS"],["ekm","EKM Digital"],["ekmmuis","Both"],["ekkm","EKKM"],["cca","CCA / Venice"]];
  const NOORIGIN = "\u0000none";
  const originsOf = w => { const f = A[w.a].aff; return f ? [f] : [NOORIGIN]; };
  // "school:Pallas" -> ["school", "Pallas"]; an artist can hold several
  const groupsOf = w => A[w.a].grp || [];
  const GROUPS = (() => {
    const m = new Map();
    for (const w of W) for (const g of groupsOf(w)) m.set(g, (m.get(g)||0)+1);
    return [...m.entries()].sort((x,y)=> y[1]-x[1]).map(x=>x[0]);
  })();
  const grpLabel = g => { const i = g.indexOf(":"); return g.slice(i+1); };
  const grpKind  = g => T("g_" + g.slice(0, g.indexOf(":")));

  const ORIGINS = (() => {
    const m = new Map();
    for (const w of W) for (const o of originsOf(w)) m.set(o, (m.get(o)||0)+1);
    return [...m.entries()].sort((x,y)=> (x[0]===NOORIGIN)-(y[0]===NOORIGIN) || y[1]-x[1]).map(x=>x[0]);
  })();
  const SRCLAB = {muis:"muis", ekm:"digi", ekmmuis:"both", cca:"cca", ekkm:"ekkm", auction:"auction"};
  // a museum holding or a work shown; not stock, not a past listing, not a lot
  const isHeld = w => !w.kind || w.kind === "held" || w.kind === "shown";
  // a past listing: sold, or no longer listed -- and the month it was last seen for sale
  const pastText = w => w.gs ? T("rl_sold") : T("rl_gone");
  // An auction result: the sale, and what the house published about the outcome.
  const eur = n => fmt(n) + " €";
  // a lot sold after the sale reads "Sold" like any other; the detail panel says how
  const auText = w => w.ao ? (w.ap ? T("au_sold", {p: eur(w.ap)}) : T("au_soldnp")) : T("au_unsold");
  // One line per artist: lots, sales, span, and the range of hammer prices.
  function auLine(i){
    const lots = W.filter(w => w.a === i && w.kind === "auction");
    if (!lots.length) return "";
    const ps = lots.filter(w => w.ao && w.ap).map(w => w.ap).sort((a, b) => a - b);
    const ys = lots.map(w => +w.ad.slice(0, 4)).sort((a, b) => a - b);
    const span = ys[0] === ys[ys.length-1] ? String(ys[0]) : `${ys[0]}–${ys[ys.length-1]}`;
    const range = ps.length ? (ps[0] === ps[ps.length-1] ? eur(ps[0]) : `${fmt(ps[0])}–${eur(ps[ps.length-1])}`) : "";
    return T("au_line", {n: lots.length, s: lots.filter(w => w.ao).length, y: span}) + (range ? ` · ${range}` : "");
  }
  const SRCFULL = {muis:"catalogued in MuIS only", ekm:"catalogued in the EKM Digital Collection only", ekmmuis:"in both catalogues, merged on inventory number", cca:"Estonian Centre for Contemporary Art", ekkm:"Contemporary Art Museum of Estonia"};
  const stag = s => s==="ed" ? '<span class="tag">ed</span>' : s==="ekm" ? '<span class="tag">EKM</span>'
                  : s==="wd" ? '<span class="tag">Wikidata</span>' : s==="noba" ? '<span class="tag">NOBA</span>' : s==="vaal" ? '<span class="tag">Vaal</span>'
                  : s==="cca" ? '<span class="tag">CCA</span>' : '<span class="tag">MuIS</span>';

  const state = {group:"decade", decOrder:"earliest", artOrder:"az", q:"", list:false, shared:null, cross:false, sale:false, tlLimit:400,
                 decade:null, media:new Set(), museums:new Set(), cats:new Set(), srcs:new Set(),
                 artist:null, letter:null, idxOpen:false, idxQ:"", idxLimit:120, idxSort:"az", showEarly:false, origins:new Set(), groups:new Set(), sort:"year", year:null, gLimit:50, from:null, to:null, undOnly:false, open:null, expand:new Set(),
                 od:new Set(),    // the decades opened in the register's mosaic
                 auLimit:20};     // sales drawn in the auction view before "more"
  const LIMIT_DEC = 50, LIMIT_ART = 18;
  const slug = s => (s||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"")
      .toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  const SRCKEYS = ["muis","ekm","ekmmuis","ekkm","cca"];
  let applying = false;

  function stateToHash(){
    const p = new URLSearchParams();
    if (LANG !== "en") p.set("lang", LANG);
    if (THEME !== "auto") p.set("theme", THEME);
    if (state.group !== "decade") p.set("group", state.group);
    const ord = state.group === "decade" ? state.decOrder : state.artOrder;
    if (ord !== "earliest" && ord !== "az") p.set("order", ord);
    if (state.sort !== "year") p.set("sort", state.sort);
    if (state.q) p.set("q", state.q);
    if (state.artist !== null) p.set("artist", slug(A[state.artist].n));
    if (state.decade !== null) p.set("decade", state.decade);
    if (state.year !== null) p.set("year", state.year);
    if (state.from !== null) p.set("from", state.from);
    if (state.to !== null) p.set("to", state.to);
    if (state.undOnly) p.set("undated", "1");
    state.media.forEach(v => p.append("medium", slug(v)));
    state.museums.forEach(v => p.append("museum", abbr(v).toLowerCase()));
    state.cats.forEach(v => p.append("cat", slug(v)));
    state.srcs.forEach(v => p.append("src", v));
    state.origins.forEach(v => p.append("origin", v===NOORIGIN?"none":v));
    state.groups.forEach(v => p.append("grp", v));
    if (state.open) p.set("open", state.open);
    state.od.forEach(v => p.append("od", v));
    if (state.idxOpen) p.set("index", state.letter || "all");
    // The list travels as its keys, so "Link to this view" of your own list is a link
    // anyone can open. An empty list is "mine" -- nothing to carry.
    if (state.cross) p.set("cross", "1");
    if (state.sale) p.set("sale", "1");
    if (state.shared) p.set("list", [...state.shared].join(","));
    else if (state.list) p.set("list", SL.size ? [...SL].join(",") : "mine");
    return p.toString().replace(/%3A/gi, ":").replace(/%2C/gi, ",");
  }
  function pushHash(replace){
    if (applying) return;
    const h = stateToHash();
    try { history[replace ? "replaceState" : "pushState"](null, "",
      location.pathname + location.search + (h ? "#" + h : "")); } catch(e){
      try { location.hash = h; } catch(e2){}
    }
    saveLast(h); refreshShare();
  }
  function hashToState(){
    const p = new URLSearchParams(location.hash.replace(/^#/, ""));
    LANG = p.get("lang") === "en" ? "en" : (p.get("lang") === "et" ? "et" : LANG);
    const th = p.get("theme");
    if (th === "light" || th === "dark" || th === "auto") THEME = th;
    state.group    = ["artist", "timeline", "auction"].includes(p.get("group")) ? p.get("group") : "decade";
    const ord      = p.get("order");
    state.decOrder = ord === "latest" ? "latest" : "earliest";
    state.artOrder = ord === "birth"  ? "birth"  : "az";
    state.sort     = KEYS[p.get("sort")] ? p.get("sort") : "year";
    state.q        = p.get("q") || "";
    const as = p.get("artist");
    const ai = as ? A.findIndex(x => slug(x.n) === as) : -1;
    state.artist = ai >= 0 ? ai : null;
    const d = p.get("decade");
    state.decade = d ? (d === "und" ? "und" : (isFinite(+d) ? +d : null)) : null;
    const yr = p.get("year");
    state.year = yr && isFinite(+yr) ? +yr : null;
    const nOrNull = v => (v && isFinite(+v)) ? +v : null;
    state.from = nOrNull(p.get("from"));
    state.to   = nOrNull(p.get("to"));
    state.undOnly = p.get("undated") === "1";
    const g = k => p.getAll(k);
    state.media   = new Set(MEDIA.filter(m => g("medium").includes(slug(m))));
    state.museums = new Set(MUSEUMS.filter(m => g("museum").includes(abbr(m).toLowerCase())));
    state.cats    = new Set(CATS.filter(c => g("cat").includes(slug(c))));
    state.srcs    = new Set(SRCKEYS.filter(s => g("src").includes(s)));
    state.origins = new Set(ORIGINS.filter(o => g("origin").includes(o===NOORIGIN?"none":o)));
    state.groups  = new Set(GROUPS.filter(x => g("grp").includes(x)));
    state.open    = p.get("open") || null;
    state.od = new Set(g("od"));
    // A list in the URL is yours if it matches what this browser holds, and someone
    // else's otherwise -- shown as a shared list, never merged into yours unasked.
    state.cross = p.get("cross") === "1";
    state.sale = p.get("sale") === "1";
    state.list = false; state.shared = null;
    const lv = p.get("list");
    if (lv === "mine") state.list = true;
    else if (lv){
      const ks = lv.split(",").filter(k => KEYSET.has(k));
      const same = ks.length === SL.size && ks.every(k => SL.has(k));
      if (same) state.list = true; else state.shared = new Set(ks);
    }
    const ix = p.get("index");
    state.idxOpen = !!ix;
    state.letter  = (ix && ix !== "all") ? ix.toUpperCase() : null;
    state.expand.clear();
    // A shared link carries one record, but each group renders only its first 50 rows,
    // so anything deeper simply was not on the page and the link showed the catalogue
    // rather than the thing being shared. Expand whichever group holds it.
    if (state.open){
      const w = W.find(x => x.k === state.open);
      if (w){ state.expand.add(String(state.group === "artist" ? w.a : decOf(w))); state.od.add(String(decOf(w))); }
    }
  }

  const $ = id => document.getElementById(id);
  const reg = $("register");

  // Fold diacritics on both sides of the comparison: this catalogue is full of
  // Estonian and Baltic-German names, and is read in English by default, so someone
  // typing "Poder" or "Kugelgen" on a plain keyboard must still find Põder and
  // Kügelgen. Folding both the haystack and the query means either spelling works.
  const defold = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const hay = w => (w._h || (w._h = defold([w.t, A[w.a].n, w.tce, w.tc, w.me, w.m, w.ee, w.e, w.nu, w.mu, w.co, w.d, w.yl, w.c]
      .filter(Boolean).join(" ").toLowerCase())));
  // 34k haystacks cost ~1s to build; do it in idle slices after first paint so the
  // first keystroke does not pay for all of them at once
  (function warmSearch(){
    let i = 0;
    const step = deadline => {
      const end = Math.min(W.length, i + 4000);
      while (i < end) hay(W[i++]);
      if (i < W.length) schedule();
    };
    const schedule = () => (window.requestIdleCallback || (f => setTimeout(f, 60)))(step);
    schedule();
  })();
  // Every word of the query must appear somewhere in the record, in any order. As a
  // single substring, "Wiiralt Põrgu" matched nothing, because no record has those
  // two words adjacent. Terms are split once per query, not once per record.
  let _qKey = null, _qTerms = [];
  const qTerms = () => {
    if (_qKey !== state.q){ _qKey = state.q; _qTerms = defold(state.q.toLowerCase()).split(/\s+/).filter(Boolean); }
    return _qTerms;
  };
  const matchText = w => { const t = qTerms(); if (!t.length) return true; const h = hay(w); return t.every(x => h.includes(x)); };
  const inList = w => { const k = listKeys(); return (!k || k.has(w.k)) && (!state.sale || w.kind === "gallery") && (!state.cross || (w.kind === "gallery" && CROSS.has(w.a))); };
  const baseSet = () => W.filter(w => matchText(w) && inList(w)
      && (state.media.size===0 || state.media.has(w.e))
      && (state.museums.size===0 || state.museums.has(w.mu))
      && (state.cats.size===0 || state.cats.has(w.c))
      && (state.srcs.size===0 || state.srcs.has(w.s))
      && (state.origins.size===0 || originsOf(w).some(o=>state.origins.has(o)))
      && (state.groups.size===0  || groupsOf(w).some(g=>state.groups.has(g)))
      && (state.artist===null || w.a===state.artist)
      && (state.undOnly ? w.y==null
          : ((state.from===null || (w.y!==null && w.y>=state.from))
          && (state.to===null   || (w.y!==null && w.y<=state.to)))));
  const baseSetIgnoringYears = () => W.filter(w => matchText(w) && inList(w)
      && (state.media.size===0 || state.media.has(w.e))
      && (state.museums.size===0 || state.museums.has(w.mu))
      && (state.cats.size===0 || state.cats.has(w.c))
      && (state.srcs.size===0 || state.srcs.has(w.s))
      && (state.artist===null || w.a===state.artist));
  const fullSet = () => baseSet().filter(w => (state.decade===null || decOf(w)===state.decade)
                                          && (state.year===null || w.y===state.year));

  function renderBars(){
    // Each bar is split: museum holdings below, gallery stock above. Since NOBA, the
    // 2020s bar is 98% works for sale, and an unsplit bar read as the most-collected
    // decade in Estonian history. The shape must not lie at a glance.
    const set = baseSet(), counts = {}, sale = {}; DECADES.forEach(d=>{counts[d]=0; sale[d]=0;}); counts.und = sale.und = 0;
    set.forEach(w => { const d = decOf(w); if (d in counts){ counts[d]++; if (w.kind === "gallery") sale[d]++; } });
    const max = Math.max(1, ...DECADES.map(d=>counts[d]));
    const cell = (key, lab, title, cls) => {
      const c = counts[key], s = sale[key], h = c ? Math.round(6 + (Math.min(c,max)/max)*66) : 2;
      const sh = c && s ? Math.round(h * s / c) : 0;
      const tip = `${title} — ${c===1?T('oneworkc'):T('nworks',{n:c})}` + (s ? ` · ${T('nforsale',{n:s})}` : "");
      return `<button class="bar-btn ${cls||""}" data-dec="${key}" aria-pressed="${state.decade===key}" title="${tip}">
        <span class="bar-n">${c||""}</span><span class="bar-fill" style="height:${h}px">${sh ? `<span class="bar-sale" style="height:${sh}px"></span>` : ""}</span><span class="bar-lab">${lab}</span></button>`;
    };
    // group the decade bars by century so 1830s and 1930s can never be read as the same "30"
    const cents = [];
    DECADES.forEach(d => {
      const c = Math.floor(d/100);
      if (!cents.length || cents[cents.length-1].c !== c) cents.push({c, ds:[]});
      cents[cents.length-1].ds.push(d);
    });
    // the earliest centuries hold a handful of works but claim as much width as the
    // 20th century's tens of thousands — fold them into one band unless asked to open.
    // Everything before 1800 folds by rule; later centuries only if they are very thin.
    const totalDated = DECADES.reduce((s,d)=>s+counts[d],0);
    let lead = 0;
    while (lead < cents.length - 1 &&
           (cents[lead].c <= 17 ||
            cents[lead].ds.reduce((s,d)=>s+counts[d],0) < totalDated * 0.01)) lead++;
    const foldable = lead >= 2;
    const early = foldable ? cents.slice(0, lead) : [];
    const rest  = foldable ? cents.slice(lead) : cents;
    const earlyTotal = early.reduce((s,g)=>s+g.ds.reduce((t,d)=>t+counts[d],0),0);
    const earlyLabel = early.length
      ? T("earlyband",{a: ordN(early[0].c+1), b: ordN(early[early.length-1].c+1)}) : "";
    const centHTML = g =>
      `<div class="cent" style="flex:${g.ds.length}">
         <div class="cent-bars">${g.ds.map(d => cell(d, String(d).slice(2), d+"s")).join("")}</div>
         <div class="cent-lab"><span class="cl-full">${esc(T("century",{n:ordN(g.c+1)}))}</span><span class="cl-abbr">${g.c+1}.</span></div>
       </div>`;
    const earlyFolded = `<div class="cent early" style="flex:0 0 118px">
         <div class="cent-bars">
           <button class="early-btn" id="early-toggle" title="${esc(T("earlyexpand"))} — ${earlyTotal===1?T('oneworkc'):T('nworks',{n:earlyTotal})}">
             <span class="bar-n">${earlyTotal||""}</span>
             <span class="early-fill" style="height:${earlyTotal?Math.max(3,Math.round(6+(Math.min(earlyTotal,max)/max)*66)):2}px"></span>
             <span class="early-lab">${esc(earlyLabel)}</span>
           </button>
         </div>
         <div class="cent-lab">&nbsp;</div>
       </div>`;
    const earlyOpen = early.map(centHTML).join("")
      + `<div class="cent" style="flex:0 0 26px"><div class="cent-bars"></div>
           <button class="cent-collapse" id="early-toggle" title="${esc(T("earlycollapse"))}">‹‹</button></div>`;
    // opened out, ~60 decade ticks share the width: the per-bar counts collide with
    // each other and the century names no longer fit. Mark the dense state for CSS.
    $("bars").className = "bars" + (foldable && state.showEarly ? " dense" : "");
    $("bars").innerHTML =
      (foldable ? (state.showEarly ? earlyOpen : earlyFolded) : "")
      + rest.map(centHTML).join("")
      + `<div class="cent nd" style="flex:1">
           <div class="cent-bars">${cell("und",T("nd"),T("undated"),"undated")}</div>
           <div class="cent-lab" title="Undated — works whose record carries no dating">&nbsp;</div>
         </div>`;
    $("histo-hint").textContent = state.decade===null ? T("selectdecade")
      : (state.decade==="und" ? T("undatedonly") : T("filteredto",{x:state.decade+"s"}));
    renderEras();
  }
  // The eras sit against the bars they describe: a band beneath the histogram with one
  // segment per period, measured from the rendered decade cells so it stays aligned
  // whether the early centuries are folded or opened. The period door this replaces
  // listed the same five names in a column, away from the data.
  function renderEras(){
    const el = $("eras"); if (!el) return;
    const bars = $("bars"), box = el.getBoundingClientRect();
    const cellFor = d => bars.querySelector(`.bar-btn[data-dec="${d}"]`);
    const early = bars.querySelector(".early-btn");
    const segs = DOOR_PERIODS.map((p, i) => {
      const [lo, hi] = p;
      let first = null, last = null;
      if (lo === null && early){ first = last = early; }              // folded pre-1700 band
      else DECADES.forEach(d => {
        const mid = d + 5;
        if ((lo === null || mid >= lo) && mid <= hi){ const c = cellFor(d); if (c){ first = first || c; last = c; } }
      });
      if (!first) return "";
      const l = first.getBoundingClientRect().left - box.left, r = last.getBoundingClientRect().right - box.left;
      const on = state.from === lo && state.to === (hi === 2099 ? null : hi) && !state.undOnly;
      const lab = dpLabel(p);
      const note = p[2] && PERIOD_NOTE[p[2]] ? ` · ${PERIOD_NOTE[p[2]][LANG === "en" ? "en" : "et"]}` : "";
      return `<button class="era" data-era="${i}" aria-pressed="${on}" title="${esc(lab)}${esc(note)} — ${PCOUNT[i].toLocaleString(LANG==="en"?"en":"et")} ${esc(T("worksn"))}"
                style="left:${l.toFixed(1)}px;width:${Math.max(0, r - l - 2).toFixed(1)}px">${esc(lab)}</button>`;
    });
    el.innerHTML = segs.join("");
    // A two-decade segment cannot hold "First Republic"; fall back to a short form, and
    // only then to an ellipsis (the title still carries the full name).
    el.querySelectorAll(".era").forEach(b => {
      if (b.scrollWidth <= b.clientWidth) return;
      const key = DOOR_PERIODS[+b.dataset.era][2], short = key && I18N[LANG === "en" ? "EN" : "ET"]["era_short_" + key];
      if (short) b.textContent = short;
    });
  }
  addEventListener("resize", (() => { let t; return () => { clearTimeout(t); t = setTimeout(renderEras, 120); }; })());

  const YEARS = (() => { const ys = W.map(w=>w.y).filter(y=>y!=null); 
    return {min: Math.min(...ys), max: Math.max(...ys)}; })();
  function fillYearSelects(){

    };
    opts("yr-from", T("earliestopt")); opts("yr-to", T("latestopt"));
  }
  function renderYearRange(){
    $("yr-from").value = state.from == null ? "" : state.from;
    $("yr-to").value   = state.to   == null ? "" : state.to;
    $("yr-from").disabled = $("yr-to").disabled = state.undOnly;
    const u = $("yr-undated");
    u.setAttribute("aria-pressed", state.undOnly);
    const undN = baseSetIgnoringYears().filter(w=>w.y==null).length;
    $("yr-und-n").textContent = undN;
    const set = fullSet();
    const ys = set.map(w=>w.y).filter(y=>y!=null);

  }

  function renderActiveFilters(){
    const el = $("activefilters"); if (!el) return;
    const chips = [];
    const add = (label, clear) => chips.push({label, clear});
    if (state.artist !== null) add(A[state.artist].n, () => state.artist = null);
    if (state.decade !== null) add(state.decade === "und" ? T("undated") : state.decade + "s",
                                   () => { state.decade = null; state.year = null; });
    if (state.year !== null) add(String(state.year), () => state.year = null);
    if (state.undOnly) add(T("undated"), () => state.undOnly = false);
    else if (state.from !== null || state.to !== null)
      add(`${state.from ?? YEARS.min}–${state.to ?? YEARS.max}`, () => { state.from = null; state.to = null; });
    state.media.forEach(v => add(medName(v), () => state.media.delete(v)));
    state.museums.forEach(v => add(abbr(v), () => state.museums.delete(v)));
    state.cats.forEach(v => add(catName(v), () => state.cats.delete(v)));
    state.srcs.forEach(v => add(SRCLAB[v] || v, () => state.srcs.delete(v)));
    state.origins.forEach(v => add(v===NOORIGIN?T("originunknown"):v, () => state.origins.delete(v)));
    state.groups.forEach(v => add(grpLabel(v), () => state.groups.delete(v)));
    if (state.q) add(`“${state.q}”`, () => { state.q = ""; $("q").value = ""; });
    if (state.shared) add(T("sl_shared", {n: state.shared.size}), () => { state.shared = null; });
    else if (state.list) add(T("mylist"), () => { state.list = false; });
    if (state.cross) add(T("doors_cross"), () => { state.cross = false; });
    if (state.sale) add(T("forsale_chip"), () => { state.sale = false; });
    ACTIVE = chips;
    // No chips, no bar: "none — showing all 51,598 works" restated the masthead.
    el.closest(".filterbar").hidden = chips.length === 0;
    el.innerHTML = chips.map((c, i) => `<button class="af" data-af="${i}" title="${esc(T("removefilter"))}">${esc(c.label)}<span>×</span></button>`).join("");
    const n = chips.length;
    $("filters-toggle").textContent = $("filterpanel").hidden
      ? (n ? T("showfiltersn",{n}) : T("showfilters")) : T("hidefilters");
  }
  let ACTIVE = [];

  // localeCompare(s, "et") builds a fresh Intl.Collator on every call, and sorting
  // 52,083 works makes hundreds of thousands of them — it was the single largest cost
  // in a render. One collator, reused, does the same comparison far more cheaply.
  const COLL = new Intl.Collator("et");
  const cmpStr = (x,y) => COLL.compare(String(x||""), String(y||""));
  const KEYS = {
    year:   w => w.y == null ? Infinity : w.y,
    artist: w => A[w.a].n,
    title:  w => w.t,
    medium: w => w.e,
    museum: w => w.mu,
    price:  w => w.ap || 0
  };
  // Every render sorted every dated work in every decade -- 48,000 of them -- with
  // Intl.Collator deciding ties on title and artist. The collator was 13% of all CPU
  // time and the sort another 4%, for rows nobody saw: a decade shows 12 to 50. A
  // sort key is folded once per work and compared as a plain string; collation only
  // ever ordered ties within one year, where locale-perfect order is invisible.
  const skey = s => (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const SK = w => w._sk || (w._sk = skey(w.t));
  const SA = w => w._sa || (w._sa = skey(A[w.a].n));
  const cmpKey = (x, y) => x < y ? -1 : x > y ? 1 : 0;
  // Opening a record, marking a bookmark, switching language: each re-renders the
  // register with the same selection, and re-sorted every decade for it. The sorted
  // groups are kept while the selection and order are unchanged.
  let _sgKey = "", _sg = new Map();
  function sortedGroup(d, items, desc){
    const key = stateToHash().replace(/&?(open|od)=[^&]*/g, "") + "|" + state.sort + "|" + desc;
    if (key !== _sgKey){ _sgKey = key; _sg = new Map(); }
    let r = _sg.get(d);
    if (!r || r.length !== items.length){ r = sortRows(items, desc); _sg.set(d, r); }
    return r;
  }
  function sortRows(items, desc){
    const sort = state.sort;
    const prim = sort === "artist" ? SA : sort === "title" ? SK
               : sort === "medium" ? (w => skey(medName(w.e))) : sort === "museum" ? (w => skey(musName(w.mu))) : null;
    if (sort === "price")                  // hammer price, highest first; works without one after
      return items.slice().sort((a,b) => ((b.ap||0)-(a.ap||0)) * (desc ? -1 : 1) || (a.y||0)-(b.y||0) || cmpKey(SK(a), SK(b)));
    return items.slice().sort((a,b) => {
      let r;
      if (!prim){
        const ua = a.y == null, ub = b.y == null;
        if (ua !== ub) return ua ? 1 : -1;
        r = (a.y || 0) - (b.y || 0);
      } else r = cmpKey(prim(a), prim(b));
      if (desc) r = -r;
      return r || (a.y||0)-(b.y||0) || cmpKey(SK(a), SK(b)) || cmpKey(SA(a), SA(b));
    });
  }

  // The masthead figures depend only on the loaded data, never on filter state, but
  // were being recomputed by three full scans of 52,083 works on every render.
  const STATS = (() => {
    let artists = 0; const museums = new Set(), galleries = new Set();
    for (const a of A) if (a.c > 0) artists++;
    for (const w of W){
      if ((w.kind || "held") === "held") museums.add(w.mu);
      else if (w.kind === "gallery") galleries.add(w.mu);
      // an auction house is neither
    }
    return {artists, museums: museums.size, galleries: galleries.size};
  })();

  let AI = null;
  function artistIndexData(){
    if (AI) return AI;
    const items = A.map((ar,i)=>({i, n:ar.n, s:surnameOf(ar.n), c:ar.c||0,
                                  l:(ar.l&&(ar.l[0]||ar.l[1]))?`${ar.l[0]}–${ar.l[1]||""}`:"", sp:decCounts(i)}))
                   .filter(x=>x.c>0)
                   .sort((x,y)=>COLL.compare(x.s, y.s));
    const letters = [];
    items.forEach(x=>{ const L = x.s[0].toUpperCase(); if (!letters.includes(L)) letters.push(L); });
    AI = {items, letters};
    return AI;
  }
  function renderArtistIndex(){
    const {items, letters} = artistIndexData();
    $("ai-rail").innerHTML = letters.map(L =>
      `<button class="ai-l" data-letter="${esc(L)}" aria-pressed="${state.letter===L}">${esc(L)}</button>`).join("");
    const t = $("ai-toggle");
    t.textContent = state.idxOpen ? T("hideindex") : T("showall",{n:items.length.toLocaleString(LANG === "en" ? "en-GB" : "et-EE")});
    t.setAttribute("aria-expanded", state.idxOpen);
    const body = $("ai-body");
    body.hidden = !state.idxOpen;
    if (!state.idxOpen){ body.innerHTML = ""; return; }
    let show = state.letter ? items.filter(x=>x.s[0].toUpperCase()===state.letter) : items;
    if (state.idxQ){
      const terms = defold(state.idxQ.toLowerCase()).split(/\s+/).filter(Boolean);
      show = show.filter(x => { const n = defold(x.n.toLowerCase()); return terms.every(t => n.includes(t)); });
    }
    // Sorted by size, the alphabet is not the organising idea any more, so the
    // letter dividers go with it — they would break the ranking into meaningless runs.
    const byWorks = state.idxSort === "works";
    if (byWorks) show = show.slice().sort((a,b)=> b.c - a.c || cmpStr(a.s, b.s));
    const total = show.length;
    show = show.slice(0, state.idxLimit);
    let cur = "", out = `<div class="ai-count">${esc(T("idxcount",{n:total.toLocaleString(LANG === "en" ? "en-GB" : "et-EE")}))}</div>`;
    if (!total) out += `<div class="ai-count">${esc(T("idxnone"))}</div>`;
    show.forEach(x=>{
      if (!byWorks){
        const L = x.s[0].toUpperCase();
        if (L !== cur){ cur = L; out += `<div class="ai-letter" id="ai-${esc(L)}">${esc(L)}</div>`; }
      }
      out += `<button class="ai-item" data-artist="${x.i}">
        <span><span class="ai-nm">${esc(x.n)}</span><br><span class="ai-dt">${esc(x.l||"")}</span></span>
        <span class="ai-rt"><span class="ai-n">${x.c}</span></span>
      </button>`;
    });
    if (total > show.length)
      out += `<button class="more" id="more-index" style="column-span:all;margin-top:10px">${esc(T("moreindex",{n:(total-show.length).toLocaleString(LANG === "en" ? "en-GB" : "et-EE")}))}</button>`;
    body.className = "ai-body" + (byWorks ? " ranked" : "");
    body.innerHTML = out;
  }

  function renderMono(){
    const el = $("mono");
    if (state.artist === null){ el.innerHTML = ""; return; }
    const ar = A[state.artist], mine = W.filter(w=>w.a===state.artist);
    const shown = fullSet().length;
    const life = (ar.l&&(ar.l[0]||ar.l[1])) ? `${ar.l[0]}–${ar.l[1]||""}` : "";
    const counts = decCounts(state.artist);
    const nz = counts.map((c,i)=>c?i:-1).filter(i=>i>=0);
    const first = nz.length ? DECADES[nz[0]] : null, last = nz.length ? DECADES[nz[nz.length-1]] : null;
    const med = {};
    mine.forEach(w=>{ med[w.e] = (med[w.e]||0)+1; });
    const medl = Object.entries(med).sort((x,y)=>y[1]-x[1]).slice(0,6)
      .map(([k,v])=>`${esc(medName(k))} <b>${v}</b>`).join(" · ");
    const und = mine.filter(w=>w.y==null).length;
    const bio = bioFor(ar);
    el.innerHTML = `<section class="mono">
      <div>
        <button class="mono-back" id="mono-back">${esc(T("allartists",{n:artistIndexData().items.length.toLocaleString(LANG === "en" ? "en-GB" : "et-EE")}))}</button>
        <h2>${esc(ar.n)}</h2>
        <div class="mono-dates">${esc(life)}${ar.ls?stag(ar.ls):""}</div>
        ${(ar.grp||[]).length ? `<div class="mono-dates">${(ar.grp||[]).map(g =>
            `<button class="showartist" style="margin:4px 6px 0 0" data-grp="${esc(g)}">${esc(grpKind(g))} ${esc(grpLabel(g))}</button>`).join("")}</div>` : ""}
        <p class="mono-bio${bio.t.length>420?" clamp":""}" id="mono-bio">${esc(bio.t)}${bio.s?stag(bio.s):""}${bio.mt?mtTag():""}${bio.alt?`<span class="tag">${esc(T("biofallback"))}</span>`:""}</p>
        ${bio.t.length>420?`<button class="bio-more" id="bio-more">${esc(T("readbio"))}</button>`:""}
        <div class="mono-links">
          ${ar.ai?`<a class="permalink" href="https://digikogu.ekm.ee/authors/author_id-${esc(ar.ai)}" target="_blank" rel="noopener">${esc(T("d_artistrec"))}</a>`:""}
          ${ar.qid?`<a class="permalink" href="https://www.wikidata.org/wiki/${esc(ar.qid)}" target="_blank" rel="noopener">${esc(T("d_wd"))}</a>`:""}
          <!-- the static page: a stable address to cite or print, which the app's
               fragment URLs are not, and the only route from app to crawlable page -->

        ${auLine(state.artist) ? `<div class="mono-au">${esc(auLine(state.artist))}</div>` : ""}
        <div class="mono-tl">
          ${spark(counts, 300, 44)}
          <div class="mono-axis"><span>${DECADES[0]}s</span><span>${esc(first?(first===last?T("activeone",{a:first+"s"}):T("active",{a:first+"s",b:last+"s"})):T("undatedonlyartist"))}</span><span>${DECADES[DECADES.length-1]}s</span></div>
        </div>
        <div class="mono-med">${medl}${und?` · ${esc(T("undated"))} <b>${und}</b>`:""}</div>
      </div>
    </section>`;
  }

  function renderFacets(){
    const scoped = W.filter(w => matchText(w) && (state.decade===null || decOf(w)===state.decade)
                            && (state.artist===null || w.a===state.artist));
    const pass = (w, skip) =>
        (skip==="med" || state.media.size===0   || state.media.has(w.e))
     && (skip==="mus" || state.museums.size===0 || state.museums.has(w.mu))
     && (skip==="cat" || state.cats.size===0    || state.cats.has(w.c))
     && (skip==="src" || state.srcs.size===0    || state.srcs.has(w.s))
     && (skip==="org" || state.origins.size===0 || originsOf(w).some(o=>state.origins.has(o)))
     && (skip==="grp" || state.groups.size===0  || groupsOf(w).some(g=>state.groups.has(g)));
    // one tally pass per facet group, instead of one full scan per chip
    const tally = (attr, key) => {
      const m = new Map();
      for (const w of scoped){
        if (!pass(w, attr)) continue;
        const v = key(w);
        if (v == null) continue;
        m.set(v, (m.get(v) || 0) + 1);
      }
      return m;
    };
    const counts = {
      med: tally("med", w => w.e),
      mus: tally("mus", w => w.mu),
      cat: tally("cat", w => w.c),
      src: tally("src", w => w.s),
      org: (() => { const m=new Map();
        for (const w of scoped){ if(!pass(w,"org")) continue;
          for (const o of originsOf(w)) m.set(o,(m.get(o)||0)+1); }
        return m; })(),
      grp: (() => { const m=new Map();
        for (const w of scoped){ if(!pass(w,"grp")) continue;
          for (const g of groupsOf(w)) m.set(g,(m.get(g)||0)+1); }
        return m; })()
    };
    const chips = (el, list, attr, sel, lab, title) => {
      $(el).innerHTML = list.map(v => {
        const key = Array.isArray(v) ? v[0] : v, text = Array.isArray(v) ? v[1] : lab(v);
        const c = counts[attr].get(key) || 0;
        if (!c && !sel.has(key)) return "";
        return `<button class="chip" data-${attr}="${esc(key)}" aria-pressed="${sel.has(key)}" title="${esc(title?title(v):text)}">${esc(text)}<span>${c}</span></button>`;
      }).join("");
    };
    chips("f-med", MEDIA,    "med", state.media,   v=>medName(v));
    chips("f-mus", MUSEUMS,  "mus", state.museums, v=>abbr(v), v=>musName(v));

                 || (m => m && Math.floor(+m[1]/100) === Math.floor(+m[2]/100) ? [m[0], String(Math.floor(+m[1]/100) + 1)] : null)

                   : `<div class="d-note"><span class="d-nolabel">${esc(T("d_desc"))}</span><em style="color:var(--grey-4)">${esc(T("d_nodesc"))}</em></div>`}

          ${w.kind==="sold" ? `<div class="d-k">${esc(T("d_status"))}</div><div class="d-v">${esc(pastText(w))}${w.gl ? `<br><span class="d-sub">${esc(T("d_lastseen", {d: w.gl}))}</span>` : ""}<br><span class="d-sub">${esc(T("d_pastnote"))}</span></div>` : ""}
          ${w.kind==="auction" ? `<div class="d-k">${esc(T("d_result"))}</div><div class="d-v">${esc(w.an)} · <b>${esc(auText(w))}</b>${w.as ? `<br><span class="d-sub">${esc(T("d_start", {p: eur(w.as)}))}</span>` : ""}${w.aa ? `<br><span class="d-sub">${esc(T("au_afternote"))}</span>` : ""}<br><span class="d-sub">${esc(T("au_note"))}</span></div>` : ""}
          ${w.nu ? `<div class="d-k">${esc(T("d_number"))}</div><div class="d-v" style="font-family:var(--mono);font-size:.78rem">${esc(w.nu)}</div>` : ""}
          ${ar.wdesc?`<div class="d-k">${esc(T("d_origin"))}</div><div class="d-v">${esc(ar.wdesc)}${ar.qid?` <a class="permalink" href="https://www.wikidata.org/wiki/${esc(ar.qid)}" target="_blank" rel="noopener">${esc(T("d_wd"))}</a>`:""}</div>`:""}
          ${ar.cit?`<div class="d-k">${esc(T("d_cit"))}</div><div class="d-v"><em>${esc(ar.cit.join(" · "))}</em>${ar.born?`<br><em>${esc(T("d_born"))}: ${esc(ar.born)}</em>`:""}</div>`:""}
          <div class="d-bio">${esc(bioFor(ar).t)}${bioFor(ar).s?stag(bioFor(ar).s):""}${bioFor(ar).mt?mtTag():""}${bioFor(ar).alt?`<span class="tag">${esc(T("biofallback"))}</span>`:""}</div>
          ${state.artist===null?`<button class="showartist" data-artist="${w.a}">All ${ar.c} works by ${esc(ar.n)} →</button>`:""}
        </div></div>`;
    }
    // A work for sale links to the gallery from the row itself; the record is one
    // click further and the link was the thing a collector came for.
    const rl = w.kind === "gallery" && w.url
      ? `<a class="rl" href="${esc(w.url)}" target="_blank" rel="noopener" title="${esc(T("d_gallerylink", {g: musName(w.mu)}))}">${esc(T("rl_view"))}</a>`
      // a past listing links to the gallery's page for as long as it stays up
      : w.kind === "sold"
      ? (w.url
        ? `<a class="rl rl-past" href="${esc(w.url)}" target="_blank" rel="noopener" title="${esc(T("d_pastlink", {g: musName(w.mu)}))}${w.gl ? ` · ${esc(T("d_lastseen", {d: w.gl}))}` : ""}">${esc(pastText(w))} ↗</a>`
        : `<span class="rl rl-past">${esc(pastText(w))}</span>`)
      // an auction result carries its outcome on the row: the sale is the point of the record
      : w.kind === "auction" && w.url
      // the price alone on the row -- it is the outcome; "sold" is in the title and the detail
      ? `<a class="rl rl-au${w.ao ? "" : " unsold"}" href="${esc(w.url)}" target="_blank" rel="noopener" title="${esc(w.an)} · ${esc(auText(w))}">${esc(w.ao ? (w.ap ? eur(w.ap) : T("au_soldnp")) : T("au_unsold"))} ↗</a>` : "";
    return `<div class="row${rl ? " has-link" : ""}${w.kind === "auction" ? " au" : ""}" data-open="${open}">
      <button class="row-btn" data-id="${esc(id)}" aria-expanded="${open}">
        ${yr}
        <span class="r-title" title="${esc(w.t)}">${esc(w.t)}${w.n>1?`<span class="src-tag" title="${w.n} catalogued objects share this title and date — sheets, impressions or parts">×${w.n}</span>`:""}</span>
        ${art}
        <span class="r-med" title="${esc(sub(w))}">${esc(medName(w.e))}</span>
        <span class="r-coll" title="${esc(musName(w.mu))} · ${esc(w.nu||"")}">${esc(abbr(w.mu))}<span class="src-tag">${esc(SRCLAB[w.s]||w.s)}</span></span>
