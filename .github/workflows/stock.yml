# Once a day, the galleries that are quick to read are read again, and a work sold or taken
# off sale since the weekly run (galleries.yml) leaves the stock the same day instead of up
# to a week later. Removals only: data/stock_check.py writes data/stock_gone.json, the one
# file committed, and build_site.sh applies it. The weekly and monthly runs empty it.
name: Daily stock check
on:
  schedule:
    - cron: "20 3 * * *"        # 03:20 UTC
  workflow_dispatch:
permissions:
  contents: read               # the job that reads the galleries cannot write; only the publish job below can
concurrency:
  group: reharvest             # never beside the weekly or monthly run: they write the same files
  cancel-in-progress: false
jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # and the job's token can only read: the publish job below pushes
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Read every source's robots.txt; stop if one says no
        working-directory: data
        run: python3 robots_check.py
      - name: Read the quick galleries again
        working-directory: data
        run: python3 -u stock_check.py
      # what the scrapers changed goes to the publish job as an artifact: this job has no token that can write
      - name: Hand over what changed
        id: changed
        run: |
          out="$RUNNER_TEMP/changed"; mkdir -p "$out"
          git diff --name-only --diff-filter=M -z -- data/stock_gone.json | while IFS= read -r -d '' f; do
            mkdir -p "$out/$(dirname "$f")"; cp -- "$f" "$out/$f"
          done
          if [ -n "$(ls -A "$out")" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "nothing changed"; fi
      - if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changed
          path: ${{ runner.temp }}/changed
          retention-days: 3
          if-no-files-found: error
    outputs:
      changed: ${{ steps.changed.outputs.changed }}

  # a fresh checkout that runs nothing the scrapers touched: it takes data/stock_gone.json and nothing else
  # (.github/publish.py), commits it and starts the deploy
  publish:
    needs: stock
    if: needs.stock.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write             # to start the deploy: a push by this token starts no workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changed
          path: ${{ runner.temp }}/changed
      - name: Take only the file this run may change
        run: python3 -I .github/publish.py "$RUNNER_TEMP/changed" data/stock_gone.json
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "daily stock check"
          git config user.email "actions@users.noreply.github.com"
          git add data/stock_gone.json
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          n=$(python3 -I -c "import json; print(len(json.load(open('data/stock_gone.json'))))")
          git -c core.hooksPath=/dev/null commit -m "Daily stock check, $(date -u +%F): $n works no longer for sale since the weekly run" -m "Automated: the quick galleries read again; data/stock_check.py."
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c core.hooksPath=/dev/null pull --rebase --autostash -q origin main
          git -c core.hooksPath=/dev/null push
          gh workflow run pages.yml --ref main
