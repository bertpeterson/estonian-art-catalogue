# Once a day, the galleries that are quick to read are read again, and a work sold or taken
# off sale since the weekly run (galleries.yml) leaves the stock the same day instead of up
# to a week later. Removals only: data/stock_check.py writes data/stock_gone.json, the one
# file committed, and build_site.sh applies it. The weekly and monthly runs empty it.
name: Daily stock check
on:
  schedule:
    - cron: "20 3 * * *"        # 03:20 UTC
  workflow_dispatch:
permissions:
  contents: write
  actions: write               # to start the deploy: a push by this token starts no workflow
concurrency:
  group: reharvest             # never beside the weekly or monthly run: they write the same files
  cancel-in-progress: false
jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Read every source's robots.txt; stop if one says no
        working-directory: data
        run: python3 robots_check.py
      - name: Read the quick galleries again
        working-directory: data
        run: python3 -u stock_check.py
      - name: Commit and deploy if a work has left
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "daily stock check"
          git config user.email "actions@users.noreply.github.com"
          git add data/stock_gone.json
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          n=$(python3 -c "import json; print(len(json.load(open('data/stock_gone.json'))))")
          git commit -m "Daily stock check, $(date -u +%F): $n works no longer for sale since the weekly run" -m "Automated: the quick galleries read again; data/stock_check.py."
          git pull --rebase -q origin main
          git push
          gh workflow run pages.yml --ref main
