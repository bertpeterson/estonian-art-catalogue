# The eight auction houses, weekly: the lots of sales still to come (upcoming_records.json)
# and any new results. A house puts a sale's catalogue online two to four weeks before
# it, so the monthly run would miss many; this reads only the houses, with their past
# sales kept in a cache between runs (a past sale's page does not change), merges,
# guards, builds, smoke-tests, commits the data and starts the deploy.
name: Weekly auction lots

on:
  schedule:
    - cron: "0 5 * * 1"         # 05:00 UTC on Mondays
  workflow_dispatch:

permissions:
  contents: read               # the job that reads the sources cannot write; only the publish job below can

concurrency:
  group: reharvest             # never beside the monthly run, which writes the same files
  cancel-in-progress: false

jobs:
  auctions:
    runs-on: ubuntu-latest
    timeout-minutes: 150          # the 28 Sep 2026 run was stopped at 60 in "The auction houses"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # and the job's token can only read: the publish job below pushes
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -q numpy==2.5.3
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/gcache
          key: auction-pages-${{ github.run_id }}
          restore-keys: auction-pages-

      - name: Restore the museum harvest from data/raw
        run: python3 data/unpack.py

      - name: Read every source's robots.txt; stop if one says no
        working-directory: data
        run: python3 robots_check.py

      - name: The auction houses
        working-directory: data
        run: |
          for s in vernissage_auctions haus_auctions eko_auctions vaal_auctions eks_auctions onk_auctions kunstikoda_auctions; do
            echo "=== $s ==="; python3 -u $s.py
          done

      - name: Merge, guard and build
        run: |
          git show HEAD:data/data.json > /tmp/data_before.json
          (cd data && python3 merge.py)
          python3 data/data_guard.py /tmp/data_before.json data/data.json
          ./build_site.sh
          # the smoke test once more before giving up: a headless browser on a shared runner
          # can miss a beat (it failed once, 2026-09-25, and passed on a re-run and a clean clone)
          node check_site.js site || { echo "site check failed; once more"; sleep 20; node check_site.js site; }
      # what the run changed in tracked files goes to the publish job as an artifact: this job has no token that can
      # write, so nothing the scrapers, pip packages or image decoders do here reaches the repository but those files
      - name: Hand over what changed
        id: changed
        run: |
          out="$RUNNER_TEMP/changed"; mkdir -p "$out"
          git diff --name-only --diff-filter=M -z -- data | while IFS= read -r -d '' f; do
            mkdir -p "$out/$(dirname "$f")"; cp -- "$f" "$out/$f"
          done
          if [ -n "$(ls -A "$out")" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "nothing changed"; fi
      - if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changed
          path: ${{ runner.temp }}/changed
          retention-days: 3
          if-no-files-found: error
    outputs:
      changed: ${{ steps.changed.outputs.changed }}

  # a fresh checkout that runs nothing the reading job touched: it takes only the data files this run may change
  # (.github/publish.py: tracked, whole JSON, never data/mood_api.json or masterpieces.json), commits and deploys
  publish:
    needs: auctions
    if: needs.auctions.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write             # to start the deploy: a push by this token starts no workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changed
          path: ${{ runner.temp }}/changed
      - name: Take only the data files this run may change
        run: python3 -I .github/publish.py "$RUNNER_TEMP/changed" "data/*.json" "data/raw/*.json.gz"
      - name: Commit and deploy if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "weekly auction lots"
          git config user.email "actions@users.noreply.github.com"
          git add -u data
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          n=$(python3 -I -c "import json; print(len(json.load(open('data/data.json')).get('upcoming', [])))")
          git -c core.hooksPath=/dev/null commit -m "Weekly auction lots, $(date -u +%F): $n coming lots" -m "Automated: read the eight auction houses' sales, merged, guarded, built and smoke-tested."
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c core.hooksPath=/dev/null pull --rebase --autostash -q origin main    # main moves while the run reads (19 Oct 2026: three pushes in its 72 min, and this push was refused)
          git -c core.hooksPath=/dev/null push
          gh workflow run pages.yml --ref main
