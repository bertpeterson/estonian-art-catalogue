# Monthly re-harvest of the seven galleries' stock.
#
# Museum holdings do not move; gallery stock does. "For sale" was found twice to
# include works that had sold, because the harvest was a snapshot nothing refreshed.
# On the first of each month this fetches every gallery again, rebuilds, and commits
# the result -- which triggers the normal Pages deploy. If any gallery's parser
# comes back empty or collapsed, harvest_guard.py fails the run and nothing is
# committed. The museum sources are never re-crawled here; MuIS is asked only for
# objects it lists as new through OAI-PMH.
name: Monthly gallery re-harvest

on:
  schedule:
    - cron: "0 4 1 * *"        # 04:00 UTC on the 1st
  workflow_dispatch:

permissions:
  contents: write
  actions: write               # to start the deploy: a push by this token starts no workflow

concurrency:
  group: reharvest
  cancel-in-progress: false

jobs:
  reharvest:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # the galleries alone took 164 min on 1 Oct 2026 (this run was stopped at 90), the auction houses over 60; GitHub stops any job at 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Restore the museum harvest from data/raw
        run: python3 data/unpack.py

      - name: Snapshot gallery counts
        working-directory: data
        run: python3 harvest_guard.py before

      - name: Read every source's robots.txt; stop if one says no
        working-directory: data
        run: python3 robots_check.py

      - name: Fetch every gallery afresh
        working-directory: data
        run: |
          rm -rf gcache
          python3 -u fetch_galleries.py      # the galleries side by side (data/fetch_galleries.py)
          # then the auction houses, one after another: four of them are galleries' own servers, just read
          for s in vernissage_auctions haus_auctions allee_auctions eko_auctions vaal_auctions eks_auctions; do
            echo "=== $s ==="
            python3 -u $s.py
          done

      # a new Lihtsad Kipskassid photograph is shown only once looked at for people
      # (data/kipskassid_check.py); the models are installed only in a week that has one
      - name: Look at new plaster-cat photographs
        working-directory: data
        run: |
          if python3 kipskassid_check.py --todo; then
            pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
            pip install -q open_clip_torch==3.3.0 opencv-python-headless==5.0.0.93 pillow==12.3.0 numpy==2.5.3
            python3 kipskassid_check.py && python3 kipskassid.py
          fi

      - name: Refuse a collapsed harvest
        working-directory: data
        run: python3 harvest_guard.py after

      # numpy for similar.py and chart_side.py, pillow for chart_side.py, anthropic for
      # translate.py. The build needs numpy; the monthly run never installed it. Pinned:
      # this job holds the API key and may push, so a new release is taken on purpose.
      - run: pip install -q numpy==2.5.3 pillow==12.3.0 anthropic==1.8.0

      - name: Merge
        run: |
          git show HEAD:data/data.json > /tmp/data_before.json
          echo '{}' > data/stock_gone.json    # every gallery read afresh: the daily check's list of works gone (stock.yml) starts again
          (cd data && python3 ledger.py && python3 muis_oai.py && gzip -c oai_records.json > raw/oai_records.json.gz && python3 ekm_images.py && python3 ekm_shapes.py && python3 merge.py && python3 gallery_shapes.py && python3 muis_shapes.py && python3 merge.py)

      # the only step that sees the API key: the scripts that read the sources' pages
      # and records run without it. Out of credit, the month's data still ships: the
      # new texts stay Estonian until a run that has credit.
      - name: Translate the new texts
        working-directory: data
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 translate.py

      - name: Check and build
        run: |
          # a merge that quietly lost records stops here, before anything is committed
          python3 data/data_guard.py /tmp/data_before.json data/data.json
          # the colour charts in the new museum photographs (numpy and PIL, reads each once);
          # the visual look-alikes need torch and stay a deliberate run on the Mac
          (cd data && python3 chart_side.py)
          # the galleries' own 768-pixel copies of new stock, for the wall (checks each once)
          (cd data && python3 img_small.py)
          # the moods of new stock pictures, for Find a work (data/stock_moods.py); CLIP only in a week that has some
          (cd data && if python3 stock_moods.py --todo; then pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 && pip install -q open_clip_torch==3.3.0 pillow==12.3.0 numpy==2.5.3 && python3 stock_moods.py; fi)
          ./build_site.sh
          # the smoke test once more before giving up: a headless browser on a shared runner
          # can miss a beat (it failed once, 2026-09-25, and passed on a re-run and a clean clone)
          node check_site.js site || { echo "site check failed; once more"; sleep 20; node check_site.js site; }
          python3 data/readme_figures.py

      - name: Commit if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "gallery re-harvest"
          git config user.email "actions@users.noreply.github.com"
          # every tracked file the pipeline rewrote (data.json, gallery_records.json,
          # raw/oai_records.json.gz, ...); site/ is built by pages.yml, not committed
          git add -u data README.md i18n.json
          if git diff --cached --quiet; then
            echo "nothing changed"; exit 0
          fi
          python3 - > /tmp/msg <<'PY'
          import json, collections, datetime
          c = collections.Counter(g["gallery"] for g in json.load(open("data/gallery_records.json")))
          print("Monthly gallery re-harvest,", datetime.date.today().isoformat(), "\n")
          for g, n in sorted(c.items()): print(f"  {g:22} {n}")
          print("\nAutomated: fetched each gallery's current stock, rebuilt, and updated the")
          print("README figures. Museum data untouched.")
          PY
          git commit -F /tmp/msg
          git push
          # a push made with this workflow's token starts no other workflow, so the deploy
          # is started by hand; without this the monthly data never reached the site
          gh workflow run pages.yml --ref main
