# Build the site from data/data.json and deploy it. site/ is not in the repo: it is
# 117 MB of derived files that were committed on every change, which is what made
# .git half a gigabyte. The build is deterministic apart from the landing page's
# per-build shuffle; the smoke test opens the result in headless Chrome and refuses
# to deploy a build that does not render.
name: Build and deploy the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the scripts also run on the Mac, whose Python is 3.9: code that only 3.12 accepts
      # (an f-string nesting its own quotes) passed CI once and broke the local build
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - name: The scripts compile under Python 3.9
        run: python -m compileall -q -l . data
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -q numpy
      - name: Build
        run: ./build_site.sh
      - name: Open the built site in headless Chrome
        run: node check_site.js site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The build was opened in a browser before it shipped; this opens what the world
  # gets -- the domain, the certificate, the worker, the data the page names.
  probe:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the live site
        run: |
          set -e
          site=https://museaal.ee
          get () { curl -sSL --retry 5 --retry-delay 10 --retry-all-errors -o body -w '%{http_code}' "$1"; }
          for i in 1 2 3 4 5 6; do
            code=$(get "$site/")
            grep -q 'data-seed=' body && [ "$code" = 200 ] && break
            echo "landing not there yet ($code), waiting"; sleep 20
          done
          grep -q 'data-seed=' body || { echo "FAIL: landing page has no baked wall"; exit 1; }
          grep -q 'http-equiv="Content-Security-Policy"' body || { echo "FAIL: no Content-Security-Policy"; exit 1; }
          v=$(grep -o 'data/index.json?v=[0-9a-f]*' body | head -1)
          [ -n "$v" ] || { echo "FAIL: page names no index"; exit 1; }
          [ "$(get "$site/$v")" = 200 ] && grep -q '"works"' body || { echo "FAIL: $v"; exit 1; }
          [ "$(get "$site/sw.js")" = 200 ] && grep -q 'museaal-v1' body || { echo "FAIL: sw.js"; exit 1; }
          [ "$(get "$site/data/bios.json?${v#*?}")" = 200 ] || { echo "FAIL: bios.json"; exit 1; }
          [ "$(get "$site/a/konrad-magi.html")" = 200 ] && grep -q 'og:image' body || { echo "FAIL: artist page"; exit 1; }
          [ "$(get "$site/stats-et.html")" = 200 ] || { echo "FAIL: stats-et"; exit 1; }
          echo "live: $v, sw.js, bios, artist page, stats"
