# Build the site from data/data.json and deploy it. site/ is not in the repo: it is
# 117 MB of derived files that were committed on every change, which is what made
# .git half a gigabyte. The build is deterministic apart from the landing page's
# per-build shuffle; the smoke test opens the result in headless Chrome and refuses
# to deploy a build that does not render.
name: Build and deploy the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # 24.04, not ubuntu-latest: from 19 Oct 2026 that is 26.04, which has no Python 3.9 for the check below
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the scripts also run on the Mac, whose Python is 3.9: code that only 3.12 accepts
      # (an f-string nesting its own quotes) passed CI once and broke the local build
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"
      - name: The scripts compile under Python 3.9
        run: python -m compileall -q -l . data
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -q numpy==2.5.3
      - name: Fixture tests (the ingestion boundary, asking prices, the gallery scrapers replayed, artist-name matching)
        run: python -m unittest discover -v tests
      - name: Build
        run: ./build_site.sh
      - name: Open the built site in headless Chrome
        # once more before giving up: a headless browser on a shared runner can miss a beat
        # (it failed once, 2026-09-25, and passed on a re-run and on a clean clone)
        run: node check_site.js site || { echo "site check failed; once more"; sleep 20; node check_site.js site; }
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      # sale alerts: what this build has for sale that the live site had not (build_alerts.py), handed to the
      # alerts job below, which sends it once the build is live. No live alerts.json yet: nothing is new
      - name: Sale alerts, what is new since the live site
        id: alerts
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/live-alerts.json" https://museaal.ee/data/alerts.json || rm -f "$RUNNER_TEMP/live-alerts.json"
          mkdir -p "$RUNNER_TEMP/alerts"
          python3 build_alerts.py new "$RUNNER_TEMP/live-alerts.json" "$RUNNER_TEMP/alerts/new.json"
          if [ -f "$RUNNER_TEMP/alerts/new.json" ]; then echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.alerts.outputs.new == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alerts
          path: ${{ runner.temp }}/alerts
          retention-days: 3
    outputs:
      alerts: ${{ steps.alerts.outputs.new }}

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Sale alerts, once the build is live: the new works go to the Worker (ALERT_KEY, a repository secret and a Worker
  # secret alike), which mails each account with the alerts on what is new by its artists. No key: nothing is sent
  alerts:
    needs: [build, deploy]
    if: needs.build.outputs.alerts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: alerts
          path: ${{ runner.temp }}/alerts
      - name: Send the sale alerts
        env:
          ALERT_KEY: ${{ secrets.ALERT_KEY }}
        run: python3 build_alerts.py send "$RUNNER_TEMP/alerts/new.json"

  # The build was opened in a browser before it shipped; this opens what the world
  # gets -- the domain, the certificate, the worker, the data the page names.
  probe:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the live site
        run: |
          set -e
          site=https://museaal.ee
          get () { curl -sSL --retry 5 --retry-delay 10 --retry-all-errors -o body -w '%{http_code}' "$1"; }
          for i in 1 2 3 4 5 6; do
            code=$(get "$site/")
            grep -q 'data-seed=' body && [ "$code" = 200 ] && break
            echo "landing not there yet ($code), waiting"; sleep 20
          done
          grep -q 'data-seed=' body || { echo "FAIL: landing page has no baked wall"; exit 1; }
          grep -q 'http-equiv="Content-Security-Policy"' body || { echo "FAIL: no Content-Security-Policy"; exit 1; }
          v=$(grep -o 'data/index.json?v=[0-9a-f]*' body | head -1)
          [ -n "$v" ] || { echo "FAIL: page names no index"; exit 1; }
          [ "$(get "$site/$v")" = 200 ] && grep -q '"cols"' body || { echo "FAIL: $v"; exit 1; }
          [ "$(get "$site/sw.js")" = 200 ] && grep -q 'museaal-v1' body || { echo "FAIL: sw.js"; exit 1; }
          [ "$(get "$site/data/bios.json?${v#*?}")" = 200 ] || { echo "FAIL: bios.json"; exit 1; }
          [ "$(get "$site/a/konrad-magi.html")" = 200 ] && grep -q 'og:image' body || { echo "FAIL: artist page"; exit 1; }
          [ "$(get "$site/stats-et.html")" = 200 ] || { echo "FAIL: stats-et"; exit 1; }
          echo "live: $v, sw.js, bios, artist page, stats"
